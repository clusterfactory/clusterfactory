# Jenkins — flavor-agnostic values (chart https://charts.jenkins.io).
# Image provenance lives in values/jenkins-upstream-values.yaml.

controller:
  admin:
    # Created by cf-config; password comes from the JENKINS_ADMIN_PASSWORD
    # package variable.
    existingSecret: cf-jenkins-admin
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  # Builds run on Kubernetes pod agents in cf-build (ADR 0009); nothing runs
  # on the controller.
  numExecutors: 0

  serviceType: ClusterIP
  servicePort: 8080
  ingress:
    enabled: false

  # Airgap: plugins come from the data-only plugins image (ADR 0006), never
  # from the update centre. The init container copies /plugins from that
  # image into an emptyDir mounted over $JENKINS_HOME/plugins, so every pod
  # start gets exactly the closure shipped in the package. The image
  # reference is flavor-specific: `pluginsImage` in values/jenkins-<flavor>-values.yaml.
  installPlugins: []
  initializeOnce: true
  customInitContainers:
    - name: plugins-loader
      image: "{{ .Values.pluginsImage }}"
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e
          rm -rf /var/jenkins_plugins/*
          cp /plugins/*.jpi /var/jenkins_plugins/
          cp /plugins.lock /var/jenkins_plugins/.plugins.lock
          echo "plugins staged: $(ls /var/jenkins_plugins/*.jpi | wc -l)"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: jenkins-plugins
          mountPath: /var/jenkins_plugins
  javaOpts: >-
    -Djenkins.install.runSetupWizard=false
    -Dhudson.model.UpdateCenter.never=true
    -Dhudson.model.DownloadService.never=true
    -Dhudson.model.UsageStatistics.disabled=true

  JCasC:
    defaultConfig: true
    configScripts: {}

  # PSA restricted
  usePodSecurityContext: true
  podSecurityContextOverride:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  sidecars:
    configAutoReload:
      enabled: true
      containerSecurityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 2Gi

  # Health probes: give the JVM time to boot on small CI nodes.
  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10

persistence:
  enabled: true
  size: 8Gi
  # Plugin volume, repopulated from the plugins image on every pod start.
  volumes:
    - name: jenkins-plugins
      emptyDir: {}
  mounts:
    - name: jenkins-plugins
      mountPath: /var/jenkins_home/plugins

agent:
  # Kubernetes plugin pod agents in the cf-build namespace (PSA baseline,
  # ADR 0009). The chart creates the Role/RoleBinding there. The demo
  # Jenkinsfile supplies its own pod YAML (jnlp + kaniko).
  enabled: true
  namespace: cf-build
  # Default jnlp container context (restricted-compatible even though the
  # namespace is baseline; only Kaniko needs root).
  runAsUser: 1000
  runAsGroup: 1000
  # Off: the plugin would merge `capabilities.drop: ALL` into *every*
  # container of a pod template, and root without DAC_OVERRIDE cannot write
  # the agent workspace. The demo Jenkinsfile sets an explicit restricted
  # context on jnlp and the documented baseline one on kaniko (ADR 0009).
  restrictedPssSecurityContext: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

rbac:
  create: true
  readSecrets: false
