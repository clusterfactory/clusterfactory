# Jenkins values for v0.3 demo
# Minimal plugins, no persistence, controller-only (no agents)

controller:
  image:
    repository: jenkins/jenkins
    tag: 2.541.3-jdk21

  adminUser: admin
  # admin password auto-generated by chart, stored in Secret

  serviceType: ClusterIP
  servicePort: 8080

  ingress:
    enabled: false    # access via port-forward

  installPlugins:
    - kubernetes:4386.v2f1fba_19b_98e
    - workflow-aggregator:634.v51b_a_c65f6781
    - git:5.9.0
    - configuration-as-code:1960.vbca_40a_e29d21
    - plain-credentials:201.va_9d6a_45df98f

  JCasC:
    defaultConfig: true
    configScripts: {}

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

persistence:
  enabled: false    # emptyDir for demo

agent:
  enabled: false    # demo pipeline runs on controller

rbac:
  create: true
  readSecrets: false
