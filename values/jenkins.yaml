# Jenkins values for v0.3 demo
# Standard upstream Jenkins chart with vanilla image (no plugins in airgap)
# For automated credential wiring in future: build custom image with plugins baked in

controller:
  image:
    repository: jenkins/jenkins
    tag: 2.541.3-jdk21

  admin:
    username: admin
    # password auto-generated by chart, stored in Secret

  serviceType: ClusterIP
  servicePort: 8080

  ingress:
    enabled: false    # access via port-forward

  # installPlugins disabled for airgap - plugins must be baked into custom image
  # For v0.3 demo: vanilla Jenkins, manual credential setup documented
  installPlugins: []

  JCasC:
    defaultConfig: true
    configScripts: {}

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

persistence:
  enabled: false    # emptyDir for demo

agent:
  enabled: false    # demo pipeline runs on controller

rbac:
  create: true
  readSecrets: false
