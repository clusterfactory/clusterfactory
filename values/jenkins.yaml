# Jenkins values for v0.3 demo
# Minimal plugins, no persistence, controller-only (no agents)

controller:
  image:
    repository: jenkins/jenkins
    tag: 2.541.3-jdk21

  admin:
    username: admin
    # password auto-generated by chart, stored in Secret

  serviceType: ClusterIP
  servicePort: 8080

  ingress:
    enabled: false    # access via port-forward

  installPlugins: []  # Plugins can't be downloaded in airgap; use image with pre-installed plugins

  JCasC:
    defaultConfig: true
    configScripts: {}

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

persistence:
  enabled: false    # emptyDir for demo

agent:
  enabled: false    # demo pipeline runs on controller

rbac:
  create: true
  readSecrets: false
