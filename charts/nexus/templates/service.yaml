apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cf-nexus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.http }}
      targetPort: http
    - name: docker
      port: {{ .Values.service.docker }}
      targetPort: docker
