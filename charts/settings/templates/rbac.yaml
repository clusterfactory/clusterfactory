apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-wire-engine
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cf-settings.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Minimal: the wire engine reads the admin Secrets via env (no API needed)
# and owns exactly one Secret, the persisted Gitea token.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cf-wire-engine
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cf-settings.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.demo.tokenSecret | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cf-wire-engine
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cf-settings.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cf-wire-engine
subjects:
  - kind: ServiceAccount
    name: cf-wire-engine
    namespace: {{ .Values.namespace }}
