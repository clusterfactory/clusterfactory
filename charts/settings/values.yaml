# cf-settings — deployed AFTER the apps (docs/design.md §4, ADR 0002). Its only
# job is to template the wire-engine Job and its RBAC. Package-level
# overrides live in values/common-values.yaml (flavor-agnostic) and
# values/<flavor>-values.yaml (image only).
namespace: clusterfactory

wireEngine:
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  backoffLimit: 3
  activeDeadlineSeconds: 900
  readyTimeoutSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Service endpoints (in-cluster DNS) and the admin Secrets cf-config created.
gitea:
  url: http://gitea-http.clusterfactory.svc.cluster.local:3000
  adminSecret: cf-gitea-admin
jenkins:
  url: http://jenkins.clusterfactory.svc.cluster.local:8080
  adminSecret: cf-jenkins-admin
nexus:
  url: http://nexus.clusterfactory.svc.cluster.local:8081
  # Docker connector as seen from Kaniko pods (host:port, plain HTTP - ADR 0010)
  dockerHost: nexus.clusterfactory.svc.cluster.local:5000
  adminSecret: cf-nexus-admin
  # Known initial admin password of the upstream image; rotated on first run.
  initialAdminPassword: admin123
  dockerRepository: docker-hosted
  # Must be "true" for the Docker connector to work (ADR 0007). Never defaulted.
  acceptCeEula: "false"

# Zarf's in-cluster registry (source of the pre-seeded base image).
zarfRegistry:
  host: zarf-docker-registry.zarf.svc.cluster.local:5000
  pullSecret: private-registry

build:
  namespace: cf-build
  # dockerconfigjson Secret the Kaniko pod mounts at /kaniko/.docker
  dockerConfigSecret: cf-nexus-docker-config
  # Base image the demo Dockerfile builds FROM: the exact reference shipped in
  # the package (pre-seeded into Nexus by the wire engine) and the name it
  # gets inside Nexus.
  baseImage:
    ref: ""          # set per flavor, e.g. docker.io/library/alpine:3.20@sha256:...
    nexusName: alpine
    nexusTag: "3.20"

demo:
  org: cf-demo
  repo: hello-world
  branch: main
  integrationUser: jenkins-ci
  jenkinsCredentialId: gitea-token
  jenkinsJob: cf-demo-hello-world
  # Secrets the wire engine owns: the Gitea token it minted, the Nexus deploy user it created.
  tokenSecret: cf-wire-gitea-token
  nexusDeploySecret: cf-wire-nexus-deploy
  nexusDeployUser: jenkins-ci
  jenkinsNexusCredentialId: nexus-docker
