{{- range $name, $ns := .Values.namespaces }}
{{- /* A policy profile may have created (and labelled) the namespace already;
       Helm cannot adopt it, so skip it. contract/namespaces.yaml is the interface. */}}
{{- if not (lookup "v1" "Namespace" "" $name) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- include "cf-config.labels" $ | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ $ns.podSecurity }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ $ns.podSecurity }}
    pod-security.kubernetes.io/audit: {{ $ns.podSecurity }}
  annotations:
    # Uninstalling cf-config must never delete application data.
    helm.sh/resource-policy: keep
{{- end }}
{{- end }}
