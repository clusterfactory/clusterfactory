{{- $ns := "clusterfactory" }}
{{- range $app, $s := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "cf-config.labels" $ | nindent 4 }}
    clusterfactory.io/app: {{ $app }}
type: Opaque
stringData:
  {{- if eq $app "jenkins" }}
  # key names expected by the Jenkins chart (controller.admin.userKey/passwordKey)
  jenkins-admin-user: {{ $s.username | quote }}
  jenkins-admin-password: {{ $s.password | quote }}
  {{- else }}
  username: {{ $s.username | quote }}
  password: {{ $s.password | quote }}
  {{- end }}
{{- end }}
