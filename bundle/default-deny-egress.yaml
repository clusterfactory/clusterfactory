# Applied by CI to every namespace before zarf init. Proves the package
# needs no egress: DNS to kube-dns and in-cluster traffic only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
