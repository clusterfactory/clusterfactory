# clusterfactory — flavor-agnostic package definition (ADR 0001).
#
# Imported by every flavor component in the root zarf.yaml. Charts deploy
# in the listed order; that ordering is the sequencing mechanism (uds-way.md §3):
#
#   1. cf-config    namespaces + PSA labels, NetworkPolicies, admin Secrets
#   2. postgresql   (step 7)
#   3. gitea
#   4. jenkins
#   5. nexus        (step 7)
#   6. argocd       (optional, ADR 0013)
#   7. cf-settings  wire-engine Job + RBAC (step 5)
#
# Nothing flavor-specific belongs here: no images:, no flavor values files.
# Each app block (chart + common values) is self-contained so it can be
# lifted into a per-app package later (ADR 0012).
kind: ZarfPackageConfig
metadata:
  name: clusterfactory-common
  description: Flavor-agnostic clusterfactory package definition; imported by the root zarf.yaml.

components:
  - name: clusterfactory
    required: true
    description: Gitea + Jenkins + Nexus with clusterfactory config/settings helper charts.
    charts:
      # cf-config lives in its own namespace so it can *own* the application
      # namespaces (Helm cannot adopt a namespace Zarf already created).
      - name: cf-config
        namespace: cf-system
        localPath: ../charts/config
        version: 0.1.0
        valuesFiles:
          - ../values/config-values.yaml

      - name: gitea
        url: https://dl.gitea.com/charts/
        version: 11.0.1
        namespace: clusterfactory
        releaseName: gitea
        valuesFiles:
          - ../values/gitea-common-values.yaml

      - name: jenkins
        url: https://charts.jenkins.io
        version: 5.9.9
        namespace: clusterfactory
        releaseName: jenkins
        valuesFiles:
          - ../values/jenkins-common-values.yaml

      - name: cf-settings
        namespace: clusterfactory
        localPath: ../charts/settings
        version: 0.1.0
        valuesFiles:
          - ../values/common-values.yaml

    # Jenkins plugin closure (ADR 0006): resolved on the connected side at
    # create time from jenkins/plugins.txt into a data-only OCI image (Zarf's
    # recommended replacement for the deprecated dataInjections). The image
    # is listed per flavor in the root zarf.yaml; an init container copies
    # the plugins into the controller's plugin volume (values/jenkins-common-values.yaml).
    actions:
      onCreate:
        before:
          - description: Resolve the Jenkins plugin closure and build the plugins data image
            cmd: make plugins plugins-image
            dir: ..
      onDeploy:
        before:
          # The API server is not a pod, so the cf-config deny-all-egress
          # policy needs its endpoint as an ipBlock. Resolve it from the
          # target cluster at deploy time (single endpoint; HA control planes
          # override APISERVER_CIDR explicitly).
          - description: Resolve the Kubernetes API server endpoint for the cf-config NetworkPolicy
            cmd: |
              ./zarf tools kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes \
                -o jsonpath='{.items[0].endpoints[0].addresses[0]}/32'
            mute: true
            setVariables:
              - name: APISERVER_CIDR
          - cmd: |
              ./zarf tools kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes \
                -o jsonpath='{.items[0].ports[0].port}'
            mute: true
            setVariables:
              - name: APISERVER_PORT

    # Readiness gating (uds-way.md §3): kstatus-based healthChecks on the
    # workloads. The wire Job wait/onFailure actions land in step 5.
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: gitea
        namespace: clusterfactory
      - apiVersion: apps/v1
        kind: StatefulSet
        name: jenkins
        namespace: clusterfactory
