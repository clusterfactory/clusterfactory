# argocd-repo-secret.yaml
# CONNECTION: Gitea → ArgoCD
# WHAT: gives ArgoCD credentials to pull from Gitea
# VARIABLES: $ARGOCD_NS, $REPO_URL, $GITEA_USER, $GITEA_TOKEN
apiVersion: v1
kind: Secret
metadata:
  name: gitea-clusterfactory-demo
  namespace: $ARGOCD_NS
  labels:
    argocd.argoproj.io/secret-type: repository
    clusterfactory/wiring: "gitea-to-argocd"
    clusterfactory/from: "gitea"
    clusterfactory/to: "argocd"
type: Opaque
stringData:
  type: git
  url: "$REPO_URL"
  username: "$GITEA_USER"
  password: "$GITEA_TOKEN"
