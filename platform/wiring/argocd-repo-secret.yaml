# argocd-repo-secret.yaml
# CONNECTION: Gitea → ArgoCD
# WHAT: gives ArgoCD credentials to pull from Gitea
# VARIABLES: $ARGOCD_NS, $REPO_URL, $GITEA_USER, $GITEA_TOKEN
apiVersion: v1
kind: Secret
metadata:
  name: gitea-platform-demo
  namespace: $ARGOCD_NS
  labels:
    argocd.argoproj.io/secret-type: repository
    platform/wiring: "gitea-to-argocd"
    platform/from: "gitea"
    platform/to: "argocd"
type: Opaque
stringData:
  type: git
  url: "$REPO_URL"
  username: "$GITEA_USER"
  password: "$GITEA_TOKEN"
