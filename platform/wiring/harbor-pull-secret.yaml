# harbor-pull-secret.yaml
# CONNECTION: Harbor → cluster workloads
# WHAT: allows workloads to pull images from Harbor
# VARIABLES: $NS, $HARBOR_URL, $HARBOR_PASSWORD
# NOTE: use a robot account in production instead of admin credentials
apiVersion: v1
kind: Secret
metadata:
  name: harbor-pull-secret
  namespace: $NS
  labels:
    clusterfactory/wiring: "harbor-pull-secret"
    clusterfactory/component: "harbor"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "$HARBOR_URL": {
          "username": "admin",
          "password": "$HARBOR_PASSWORD",
          "auth": ""
        }
      }
    }
