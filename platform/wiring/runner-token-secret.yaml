# runner-token-secret.yaml
# CONNECTION: runner ← Gitea
# WHAT: provides runner registration token so the runner can register with Gitea
# VARIABLES: $NS, $RELEASE_NAME, $RUNNER_TOKEN, $GITEA_USER
apiVersion: v1
kind: Secret
metadata:
  name: $RELEASE_NAME-runner-token
  namespace: $NS
  labels:
    platform/wiring: "runner-token"
    platform/component: "gitea-actions"
type: Opaque
stringData:
  token: "$RUNNER_TOKEN"
  gitea_url: "http://$RELEASE_NAME-gitea-http.$NS.svc.cluster.local:3000"
  username: "$GITEA_USER"
