# crossplane-aws-secret.yaml — template for ExternalSecret-based AWS credentials
# Requires: External Secrets Operator installed, OpenBao ClusterSecretStore configured
# Populate OpenBao first:
#   bao kv put secret/clusterfactory/aws access_key_id=AKI... secret_access_key=...
#
# This file is NOT applied automatically. Copy to your deploy/ folder and
# configure the ClusterSecretStore to activate it.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aws-provider-creds
  namespace: $NS
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-clusterfactory
    kind: ClusterSecretStore
  target:
    name: aws-provider-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: secret/clusterfactory/aws
        property: credentials_file
