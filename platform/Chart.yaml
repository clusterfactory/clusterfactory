apiVersion: v2
name: clusterfactory
description: >
  One helm install. Five CNCF-upstream components (Gitea, ArgoCD, Harbor,
  OpenBao, Crossplane) pre-wired and ready to use as a GitOps management
  platform. All connections live in readable wiring/ YAML files.
  Includes a browser terminal (Cockpit) and cluster UI (Headlamp).
type: application
version: 0.1.18
appVersion: "0.1.18"
keywords:
  - gitops
  - gitea
  - argocd
  - harbor
  - crossplane
  - openbao
  - kubernetes
  - platform-engineering
  - infrastructure-as-code
home: https://github.com/clusterfactory/clusterfactory
sources:
  - https://github.com/clusterfactory/clusterfactory
maintainers:
  - name: clusterfactory
    url: https://github.com/clusterfactory

dependencies:
  - name: harbor
    version: "1.16.2"
    repository: "https://helm.goharbor.io"
    condition: harbor.enabled
  # gitea is installed as a separate helm release by bootstrap.sh
  # (the gitea chart alone is 450KB, which pushes the Helm release secret
  #  over Kubernetes' 1MB Secret limit when combined with the other charts).
  # Service names are identical: clusterfactory-gitea-http, etc.
  - name: openbao
    version: "0.5.0"
    repository: "https://openbao.github.io/openbao-helm"
    condition: openbao.enabled
  - name: crossplane
    version: "1.18.5"
    repository: "https://charts.crossplane.io/stable"
    condition: crossplane.enabled
  - name: argo-cd
    version: "7.8.28"
    repository: "https://argoproj.github.io/argo-helm"
    condition: argo-cd.enabled
  - name: ingress-nginx
    version: "4.12.2"
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress-nginx.enabled
  # Optional security add-ons — NOT included by default (large charts that push
  # the Helm release secret over 1MB). To enable, install them separately:
  #
  #   helm repo add goauthentik https://charts.goauthentik.io
  #   helm upgrade clusterfactory . --set authentik.enabled=true \
  #     --dependency-update
  #
  # Uncomment to include in this chart:
  # - name: authentik
  #   version: "2025.4.1"
  #   repository: "https://charts.goauthentik.io"
  #   condition: authentik.enabled
  # - name: kyverno
  #   version: "3.3.4"
  #   repository: "https://kyverno.github.io/kyverno/"
  #   condition: kyverno.enabled
  # - name: falco
  #   version: "4.14.0"
  #   repository: "https://falcosecurity.github.io/charts"
  #   condition: falco.enabled
