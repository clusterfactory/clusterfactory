apiVersion: v2
name: clusterfactory
description: >
  Bootstrap chart for RKE2. Installs Cockpit, Headlamp, act_runner, and
  Ingress rules. Gitea is installed as a separate Helm release by bootstrap.sh.
  Platform components (ArgoCD, Harbor, OpenBao, Crossplane) are installed
  by a Gitea Actions workflow triggered after this chart installs.
type: application
version: 0.2.13
appVersion: "0.2.13"
keywords:
  - gitops
  - gitea
  - argocd
  - harbor
  - crossplane
  - openbao
  - kubernetes
  - platform-engineering
home: https://github.com/clusterfactory/clusterfactory
sources:
  - https://github.com/clusterfactory/clusterfactory
maintainers:
  - name: clusterfactory
    url: https://github.com/clusterfactory
# No subchart dependencies — all kept out to avoid the Kubernetes 1 MB
# Helm release Secret limit. RKE2 ships rke2-ingress-nginx; everything
# else is installed via separate Helm releases in bootstrap.sh or by the
# Gitea Actions workflow.
