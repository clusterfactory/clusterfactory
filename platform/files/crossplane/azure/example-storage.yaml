# Example: Azure Storage Account managed by Crossplane
# Apply after configuring Azure credentials via the Gitea workflow.
apiVersion: storage.azure.upbound.io/v1beta1
kind: Account
metadata:
  name: my-crossplane-storage
spec:
  forProvider:
    location: East US
    resourceGroupName: my-resource-group
    accountReplicationType: LRS
    accountTier: Standard
    accountKind: StorageV2
  providerConfigRef:
    name: default
