# Example: GCS bucket managed by Crossplane
# Apply after configuring GCP credentials via the Gitea workflow.
apiVersion: storage.gcp.upbound.io/v1beta1
kind: Bucket
metadata:
  name: my-crossplane-bucket
  annotations:
    crossplane.io/external-name: my-crossplane-bucket-UNIQUE_SUFFIX
spec:
  forProvider:
    location: US
  providerConfigRef:
    name: default
