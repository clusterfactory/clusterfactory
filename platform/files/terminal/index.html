<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>planectl management cluster</title>
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
<style>
  :root {
    --bg: #0a0e1a; --surface: #0f1628; --border: #1e2d4a;
    --accent: #00d4ff; --green: #00ff88; --red: #ff3b5c;
    --text: #e2e8f0; --muted: #8892a4; --card: #111827;
    --header-h: 52px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,212,255,0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }

  header {
    height: var(--header-h); background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 16px;
    position: relative; z-index: 10; flex-shrink: 0;
  }
  .logo { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  .sep  { width: 1px; height: 24px; background: var(--border); }
  .title { font-size: 14px; font-weight: 700; }
  .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .header-link {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 5px;
    font-family: monospace; font-size: 10px;
    text-decoration: none; border: 1px solid var(--border);
    background: rgba(15,22,40,0.95); color: var(--muted);
    transition: all 0.2s; letter-spacing: 1px; cursor: pointer;
  }
  .header-link:hover { color: var(--text); border-color: var(--accent); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 2s infinite; }

  .status-panel {
    padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; flex-wrap: wrap;
    position: relative; z-index: 10; flex-shrink: 0;
  }
  .wire-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font-family: monospace; font-size: 11px;
    display: flex; align-items: center; gap: 8px; min-width: 140px;
  }
  .wire-card.ok      { border-color: rgba(0,255,136,0.3); }
  .wire-card.pending { border-color: rgba(210,153,34,0.3); }
  .wire-card.error   { border-color: rgba(255,59,92,0.3); }
  .wire-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .wire-card.ok .wire-dot      { background: var(--green); }
  .wire-card.pending .wire-dot { background: #d29922; animation: blink 1.5s infinite; }
  .wire-card.error .wire-dot   { background: var(--red); }
  .wire-name { color: var(--text); font-weight: 700; }
  .wire-desc { color: var(--muted); font-size: 10px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .terminal-panel {
    flex: 1; display: flex; flex-direction: column;
    background: #0d1117; position: relative; z-index: 1; min-height: 0;
  }
  .terminal-bar {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 8px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .traffic { display: flex; gap: 5px; }
  .tl { width: 11px; height: 11px; border-radius: 50%; }
  .tl-r { background: #ff5f57; } .tl-y { background: #febc2e; } .tl-g { background: #28c840; }
  .t-title { flex: 1; text-align: center; font-size: 11px; color: #8b949e; font-family: monospace; }
  .t-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: monospace; }
  .t-btn:hover { background: #30363d; }
  #tc { flex: 1; padding: 6px; min-height: 0; overflow: hidden; }
  #tc .xterm { height: 100%; }

  .cmd-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 8px 20px; display: flex; gap: 8px; flex-wrap: wrap;
    flex-shrink: 0; position: relative; z-index: 10;
  }
  .cmd-pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 12px; font-family: monospace; font-size: 10px; color: var(--muted);
    cursor: pointer; transition: all 0.15s; letter-spacing: 0.5px;
  }
  .cmd-pill:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }

  #conn-dot   { display:inline-block; width:7px; height:7px; border-radius:50%; background:#d29922; margin:0 4px; vertical-align:middle; }
  #conn-label { font-size:10px; color:#8b949e; }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo-text">clusterfactory</div>
  <div class="sep" id="header-sep" style="display:none"></div>
  <div class="title" id="header-title" style="display:none"></div>
  <div class="right">
    <a class="header-link" id="gitea-link" href="#" target="_blank">
      <span class="live-dot"></span>Gitea
    </a>
    <a class="header-link" id="argo-link" href="#" target="_blank">
      <span class="live-dot"></span>ArgoCD
    </a>
    <a class="header-link" id="harbor-link" href="#" target="_blank">
      <span class="live-dot"></span>Harbor
    </a>
    <a class="header-link" id="headlamp-link" href="#" target="_blank">
      <span>⎈</span> headlamp
    </a>
    <span id="conn-dot"></span>
    <span id="conn-label">connecting…</span>
  </div>
</header>

<div class="status-panel" id="status-panel">
  <div class="wire-card pending" id="card-gitea">
    <div class="wire-dot"></div>
    <div><div class="wire-name">gitea</div><div class="wire-desc">checking…</div></div>
  </div>
  <div class="wire-card pending" id="card-argocd">
    <div class="wire-dot"></div>
    <div><div class="wire-name">argocd</div><div class="wire-desc">checking…</div></div>
  </div>
  <div class="wire-card pending" id="card-crossplane">
    <div class="wire-dot"></div>
    <div><div class="wire-name">crossplane</div><div class="wire-desc">checking…</div></div>
  </div>
  <div class="wire-card pending" id="card-wiring">
    <div class="wire-dot"></div>
    <div><div class="wire-name">wiring</div><div class="wire-desc">checking…</div></div>
    <a href="/wiring" target="_blank" title="wiring diagram" style="margin-left:8px;color:var(--muted);font-size:14px;text-decoration:none;line-height:1;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">⎈</a>
  </div>
</div>

<div class="terminal-panel">
  <div class="terminal-bar">
    <div class="traffic"><span class="tl tl-r"></span><span class="tl tl-y"></span><span class="tl tl-g"></span></div>
    <span class="t-title">live shell</span>
<button class="t-btn" onclick="term.clear()">clear</button>
  </div>
  <div id="tc"></div>
</div>

<div class="cmd-bar">
  <div class="cmd-pill" onclick="run('kubectl get pods -n clusterfactory\r')">pods</div>
  <div class="cmd-pill" onclick="run('kubectl get jobs -n clusterfactory\r')">jobs</div>
  <div class="cmd-pill" onclick="run('kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -15\r')">events</div>
  <div class="cmd-pill" onclick="run('kubectl get applications -n clusterfactory 2>/dev/null || echo \"no argocd apps yet\"\r')">apps</div>
  <div class="cmd-pill" onclick="run('helm list -A\r')">helm</div>
  <div class="cmd-pill" onclick="run('kubectl get secret clusterfactory-wiring-tokens -n clusterfactory -o json | python3 -c \"import json,sys,base64; [print(k,\\\":\\\",base64.b64decode(v).decode()) for k,v in json.load(sys.stdin)[\\\"data\\\"].items()]\"\r')">tokens</div>
  <div class="cmd-pill" onclick="run('echo gitea: admin / admin123\r')">gitea pw</div>
  <div class="cmd-pill" onclick="run('bao kv get -address=http://clusterfactory-openbao.clusterfactory:8200 -token=root secret/argocd\r')">argocd pw</div>
  <div class="cmd-pill" onclick="run('bao kv get -address=http://clusterfactory-openbao.clusterfactory:8200 -token=root secret/harbor\r')">harbor pw</div>
  <div class="cmd-pill" onclick="run('echo openbao token: root\r')">openbao token</div>
  <div class="cmd-pill" onclick="run('kubectl create token headlamp-admin -n kube-system --duration=8760h\r')">headlamp token</div>
</div>

<script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="node_modules/@xterm/addon-attach/lib/addon-attach.js"></script>
<script>

const term = new Terminal({
  theme: {
    background:'#0d1117', foreground:'#e6edf3', cursor:'#00d4ff', cursorAccent:'#0d1117',
    selectionBackground:'#1e3a5f',
    black:'#484f58', red:'#ff7b72', green:'#3fb950', yellow:'#d29922',
    blue:'#58a6ff', magenta:'#bc8cff', cyan:'#39c5cf', white:'#b1bac4',
  },
  fontFamily:'"Cascadia Code","Fira Code","JetBrains Mono",Menlo,monospace',
  fontSize: 13, lineHeight: 1.4, cursorBlink: true, cursorStyle: 'block',
  scrollback: 5000, allowProposedApi: true,
});

const fitAddon  = new FitAddon.FitAddon();
const webLinks  = new WebLinksAddon.WebLinksAddon();
term.loadAddon(fitAddon);
term.loadAddon(webLinks);
term.open(document.getElementById('tc'));
fitAddon.fit();

let ws, attachAddon;

// Send a command to the PTY via b64 (matches server.js handler)
function run(cmd) {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'b64', data: btoa(cmd) }));
}

function sendResize() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
}

function setStatus(state) {
  const dot   = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  if (state === 'connected') {
    dot.style.background   = '#3fb950';
    label.textContent      = 'connected';
  } else {
    dot.style.background   = '#ff7b72';
    label.textContent      = 'reconnecting…';
  }
}

function connect() {
  const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  // Auth is handled by Authentik forward-auth at the nginx level.
  // Session cookie is set by Authentik and validated per-request.
  ws = new WebSocket(`${wsProto}//${location.host}/`);
  ws.onopen = () => {
    attachAddon = new AttachAddon.AttachAddon(ws);
    term.loadAddon(attachAddon);
    sendResize();
    setStatus('connected');
  };
  ws.onclose = () => { setStatus('disconnected'); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
}

window.addEventListener('resize', () => { fitAddon.fit(); sendResize(); });
term.onResize(sendResize);

// Rewrite a URL from the server to use the browser's current port.
// This ensures SSM tunnel port (e.g. :8080) is preserved when the server
// returns URLs with the remote port (e.g. :80).
function localUrl(serverUrl) {
  try {
    const hostname = new URL(serverUrl).hostname;
    const port     = location.port ? ':' + location.port : '';
    return location.protocol + '//' + hostname + port + '/';
  } catch (_) { return serverUrl; }
}

// Load config and patch header links
fetch('/config')
  .then(r => r.json())
  .then(cfg => {
    if (cfg.title) {
      const words = cfg.title.split(' ');
      const subtitle = words.slice(1).join(' ');
      document.getElementById('logo-text').textContent = words[0];
      document.title = cfg.title;
      if (subtitle) {
        document.getElementById('header-title').textContent = subtitle;
        document.getElementById('header-title').style.display = '';
        document.getElementById('header-sep').style.display   = '';
      }
    }
    if (cfg.giteaUrl)    document.getElementById('gitea-link').href    = localUrl(cfg.giteaUrl);
    if (cfg.argoUrl)     document.getElementById('argo-link').href     = localUrl(cfg.argoUrl);
    if (cfg.harborUrl)   document.getElementById('harbor-link').href   = localUrl(cfg.harborUrl);
    if (cfg.headlampUrl) document.getElementById('headlamp-link').href = localUrl(cfg.headlampUrl);
  })
  .catch(() => {});

// Apply a status map { gitea, argocd, crossplane, wiring } → 'ok' | 'pending' | 'error'
function applyStatus(st) {
  const labels = { gitea: 'running', argocd: 'running', crossplane: 'running', wiring: 'applied' };
  ['gitea', 'argocd', 'crossplane', 'wiring'].forEach(id => {
    const card = document.getElementById('card-' + id);
    if (!card) return;
    const s = st[id] || 'pending';
    card.className = 'wire-card ' + s;
    card.querySelector('.wire-desc').textContent = s === 'ok' ? labels[id] : 'checking\u2026';
  });
}

// Poll /status every 10 s; first poll after 4 s
function pollStatus() {
  fetch('/status')
    .then(r => r.json())
    .then(applyStatus)
    .catch(() => {})
    .then(() => setTimeout(pollStatus, 10000));
}

connect();
setTimeout(pollStatus, 4000);
</script>
</body>
</html>
