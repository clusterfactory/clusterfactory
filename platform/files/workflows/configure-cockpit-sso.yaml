name: Configure Cockpit SSO

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KUBECONFIG: /etc/rancher/rke2/rke2.yaml

    steps:
      - name: Bootstrap Authentik API token
        run: |
          set -euo pipefail

          AK_POD=$(kubectl get pod -n authentik \
            -l app.kubernetes.io/component=server \
            -o jsonpath='{.items[0].metadata.name}')

          AK_TOKEN=$(kubectl exec "${AK_POD}" -n authentik -- \
            python -m manage shell -c "
from authentik.core.models import Token, User, TokenIntents
user = User.objects.get(username='akadmin')
token, _ = Token.objects.get_or_create(
    identifier='gitea-workflow',
    defaults={'user': user, 'intent': TokenIntents.INTENT_API}
)
print(token.key)
" 2>/dev/null | tail -1)

          AK_IP=$(kubectl get svc -n authentik authentik-server \
            -o jsonpath='{.spec.clusterIP}')
          AK_HOST=$(kubectl get ingress -n authentik \
            -o jsonpath='{.items[0].spec.rules[0].host}')

          echo "AK_TOKEN=${AK_TOKEN}" >> "$GITHUB_ENV"
          echo "AK_IP=${AK_IP}"       >> "$GITHUB_ENV"
          echo "AK_HOST=${AK_HOST}"   >> "$GITHUB_ENV"
          echo "AK_URL=http://${AK_IP}" >> "$GITHUB_ENV"
          echo "Authentik API ready at http://${AK_IP} (host: ${AK_HOST})"

      - name: Get flow UUIDs
        run: |
          set -euo pipefail

          AUTH_FLOW=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/flows/instances/?slug=default-authentication-flow" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['pk'])")

          AUTHZ_FLOW=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/flows/instances/?slug=default-provider-authorization-implicit-consent" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['pk'])")

          echo "AUTH_FLOW=${AUTH_FLOW}"   >> "$GITHUB_ENV"
          echo "AUTHZ_FLOW=${AUTHZ_FLOW}" >> "$GITHUB_ENV"
          echo "Auth flow:  ${AUTH_FLOW}"
          echo "Authz flow: ${AUTHZ_FLOW}"

      - name: Create Proxy Provider (idempotent)
        run: |
          set -euo pipefail

          # Check if provider already exists
          EXISTING=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/providers/proxy/?name=cockpit-proxy" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['results'][0]['pk'] if r['count'] > 0 else '')")

          if [ -n "${EXISTING}" ]; then
            echo "Provider already exists: ${EXISTING}"
            echo "PROVIDER_PK=${EXISTING}" >> "$GITHUB_ENV"
          else
            PROVIDER_PK=$(curl -sf -X POST \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              -H "Content-Type: application/json" \
              "${AK_URL}/api/v3/providers/proxy/" \
              -d "{
                \"name\": \"cockpit-proxy\",
                \"authentication_flow\": \"${AUTH_FLOW}\",
                \"authorization_flow\": \"${AUTHZ_FLOW}\",
                \"external_host\": \"https://${AK_HOST}\",
                \"mode\": \"forward_single\"
              }" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['pk'])")
            echo "Provider created: ${PROVIDER_PK}"
            echo "PROVIDER_PK=${PROVIDER_PK}" >> "$GITHUB_ENV"
          fi

      - name: Create Application (idempotent)
        run: |
          set -euo pipefail

          EXISTING=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/core/applications/?slug=cockpit" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['results'][0]['slug'] if r['count'] > 0 else '')")

          if [ -n "${EXISTING}" ]; then
            echo "Application already exists: ${EXISTING}"
          else
            curl -sf -X POST \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              -H "Content-Type: application/json" \
              "${AK_URL}/api/v3/core/applications/" \
              -d "{
                \"name\": \"Cockpit\",
                \"slug\": \"cockpit\",
                \"provider\": ${PROVIDER_PK}
              }" \
              | python3 -c "import sys,json; print('Application created:', json.load(sys.stdin)['name'])"
          fi

      - name: Add provider to embedded outpost
        run: |
          set -euo pipefail

          OUTPOST_ID=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/outposts/instances/?type=proxy" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['pk'])")

          # Get current providers, add ours if not already present
          PROVIDERS_JSON=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/outposts/instances/${OUTPOST_ID}/" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
providers = d['providers']
pk = int('${PROVIDER_PK}')
if pk not in providers:
    providers.append(pk)
print(json.dumps(providers))
")

          curl -sf -X PATCH \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            -H "Content-Type: application/json" \
            "${AK_URL}/api/v3/outposts/instances/${OUTPOST_ID}/" \
            -d "{\"providers\": ${PROVIDERS_JSON}}" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Outpost providers:', r['providers'])"

      - name: Patch Cockpit ingress with auth annotations
        run: |
          set -euo pipefail

          kubectl annotate ingress clusterfactory -n clusterfactory --overwrite \
            "nginx.ingress.kubernetes.io/auth-url=http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000/outpost.goauthentik.io/auth/nginx" \
            "nginx.ingress.kubernetes.io/auth-signin=https://${AK_HOST}/outpost.goauthentik.io/start?rd=\$scheme://\$http_host\$request_uri" \
            "nginx.ingress.kubernetes.io/auth-response-headers=Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid" \
            "nginx.ingress.kubernetes.io/auth-snippet=proxy_set_header X-Original-URL \$scheme://\$http_host\$request_uri;"

          echo "Ingress patched."
          kubectl get ingress clusterfactory -n clusterfactory -o jsonpath='{.metadata.annotations}' \
            | python3 -m json.tool

      - name: Done
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Cockpit SSO configured                                          ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Authentik provider:   cockpit-proxy (forward_single)"
          echo "  Authentik application: Cockpit"
          echo "  Auth URL:  http://ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local:9000"
          echo "  Sign-in:   https://${AK_HOST}/outpost.goauthentik.io/start"
          echo ""
          echo "  Visiting any service will now redirect to Authentik login."
          echo "  Log in as akadmin to access Cockpit."
