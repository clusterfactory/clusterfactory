name: Install Platform

on:
  push:
    branches: [main]
    paths:
      - '.gitea/workflows/install-platform.yaml'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NAMESPACE: ${{ secrets.CF_NAMESPACE }}
      RELEASE:    ${{ secrets.CF_RELEASE }}

    steps:
      - name: Install tools (kubectl + helm + jq)
        run: |
          # kubectl
          K8S_VER=$(curl -sfL https://dl.k8s.io/release/stable.txt)
          curl -sfLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${K8S_VER}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          # helm
          curl -sf https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          # jq (act_runner base image is Alpine)
          apk add -q jq 2>/dev/null || apt-get install -yq jq 2>/dev/null || true
          kubectl version --client --short
          helm version --short

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Add Helm repositories
        run: |
          helm repo add argo        https://argoproj.github.io/argo-helm   --force-update
          helm repo add harbor      https://helm.goharbor.io               --force-update
          helm repo add openbao     https://openbao.github.io/openbao-helm --force-update
          helm repo add crossplane  https://charts.crossplane.io/stable    --force-update
          helm repo update

      # ── ArgoCD ─────────────────────────────────────────────────────────────
      - name: Install ArgoCD CRDs
        run: |
          APP_VER=$(helm show chart argo/argo-cd \
            --version "${{ secrets.ARGOCD_CHART_VERSION }}" \
            | awk '/^appVersion:/{gsub(/"/,"",$2); print $2}')
          CRD_BASE="https://raw.githubusercontent.com/argoproj/argo-cd/v${APP_VER}/manifests/crds"
          for crd in application applicationset appproject; do
            kubectl apply -f "${CRD_BASE}/${crd}-crd.yaml" --server-side 2>/dev/null || \
            kubectl apply -f "${CRD_BASE}/${crd}-crd.yaml"
          done

      - name: Install ArgoCD
        run: |
          helm upgrade --install "${RELEASE}-argo-cd" argo/argo-cd \
            --version "${{ secrets.ARGOCD_CHART_VERSION }}" \
            --namespace "${NAMESPACE}" \
            --set crds.install=false \
            --set configs.params."server\.insecure"=true \
            --set dex.enabled=false \
            --set notifications.enabled=false \
            --set applicationSet.enabled=false \
            --set server.service.type=ClusterIP \
            --wait --timeout 10m

      # ── Harbor ─────────────────────────────────────────────────────────────
      - name: Install Harbor
        run: |
          helm upgrade --install "${RELEASE}-harbor" harbor/harbor \
            --version "${{ secrets.HARBOR_CHART_VERSION }}" \
            --namespace "${NAMESPACE}" \
            --set expose.type=nodePort \
            --set expose.tls.enabled=false \
            --set "harborAdminPassword=${{ secrets.HARBOR_ADMIN_PASSWORD }}" \
            --set persistence.enabled=true \
            --wait --timeout 15m

      # ── OpenBao ────────────────────────────────────────────────────────────
      - name: Install OpenBao
        run: |
          helm upgrade --install "${RELEASE}-openbao" openbao/openbao \
            --version "${{ secrets.OPENBAO_CHART_VERSION }}" \
            --namespace "${NAMESPACE}" \
            --set server.dev.enabled=false \
            --set server.standalone.enabled=true \
            --set "server.standalone.config=ui = true\nlistener \"tcp\" {\n  tls_disable = 1\n  address = \"[::]:8200\"\n  cluster_address = \"[::]:8201\"\n}\nstorage \"file\" {\n  path = \"/vault/data\"\n}\n" \
            --set server.dataStorage.enabled=true \
            --set server.dataStorage.size=1Gi \
            --set server.service.type=ClusterIP \
            --wait --timeout 10m

      - name: Initialize and unseal OpenBao
        run: |
          OPENBAO_ADDR="http://${RELEASE}-openbao.${NAMESPACE}.svc.cluster.local:8200"

          # Wait for HTTP server (501=uninitialized is fine)
          for i in $(seq 1 60); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 \
              "${OPENBAO_ADDR}/v1/sys/health" 2>/dev/null || echo "000")
            [ "$HTTP" != "000" ] && break
            sleep 5
          done

          INITIALIZED=$(curl -sf "${OPENBAO_ADDR}/v1/sys/health" \
            | jq -r '.initialized // false')

          if [ "$INITIALIZED" = "false" ]; then
            INIT_RESP=$(curl -sf -X POST "${OPENBAO_ADDR}/v1/sys/init" \
              -H "Content-Type: application/json" \
              -d '{"secret_shares":1,"secret_threshold":1}')
            UNSEAL_KEY=$(echo "$INIT_RESP" | jq -r '.keys[0]')
            ROOT_TOKEN=$(echo "$INIT_RESP" | jq -r '.root_token')

            kubectl create secret generic "${RELEASE}-openbao-init" \
              --namespace "${NAMESPACE}" \
              --from-literal=unseal_key="${UNSEAL_KEY}" \
              --from-literal=root_token="${ROOT_TOKEN}" \
              --dry-run=client -o yaml | kubectl apply -f -

            curl -sf -X POST "${OPENBAO_ADDR}/v1/sys/unseal" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${UNSEAL_KEY}\"}" > /dev/null
            echo "OpenBao initialized and unsealed."
          else
            SEALED=$(curl -sf "${OPENBAO_ADDR}/v1/sys/health" | jq -r '.sealed // true')
            if [ "$SEALED" = "true" ]; then
              UNSEAL_KEY=$(kubectl get secret "${RELEASE}-openbao-init" \
                -n "${NAMESPACE}" -o jsonpath='{.data.unseal_key}' | base64 -d)
              curl -sf -X POST "${OPENBAO_ADDR}/v1/sys/unseal" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"${UNSEAL_KEY}\"}" > /dev/null
              echo "OpenBao unsealed."
            else
              echo "OpenBao already initialized and unsealed."
            fi
          fi

      # ── Crossplane ─────────────────────────────────────────────────────────
      - name: Install Crossplane
        run: |
          helm upgrade --install "${RELEASE}-crossplane" crossplane/crossplane \
            --version "${{ secrets.CROSSPLANE_CHART_VERSION }}" \
            --namespace "${NAMESPACE}" \
            --wait --timeout 10m

      # ── Wiring ─────────────────────────────────────────────────────────────
      - name: Configure OpenBao (Kubernetes auth + policies)
        run: |
          OPENBAO_ADDR="http://${RELEASE}-openbao.${NAMESPACE}.svc.cluster.local:8200"
          OPENBAO_TOKEN=$(kubectl get secret "${RELEASE}-openbao-init" \
            -n "${NAMESPACE}" -o jsonpath='{.data.root_token}' | base64 -d)

          # Enable Kubernetes auth
          curl -s -X POST "${OPENBAO_ADDR}/v1/sys/auth/kubernetes" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"kubernetes"}' > /dev/null 2>&1 || true

          curl -sf -X POST "${OPENBAO_ADDR}/v1/auth/kubernetes/config" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"kubernetes_host":"https://kubernetes.default.svc"}' > /dev/null

          # Read policy
          curl -sf -X PUT "${OPENBAO_ADDR}/v1/sys/policies/acl/clusterfactory-reader" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"policy":"path \"secret/*\" { capabilities = [\"read\"] }"}' > /dev/null

          curl -sf -X POST "${OPENBAO_ADDR}/v1/auth/kubernetes/role/clusterfactory-reader" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"bound_service_account_names\":[\"*\"],\"bound_service_account_namespaces\":[\"${NAMESPACE}\"],\"policies\":[\"clusterfactory-reader\"],\"ttl\":\"1h\"}" > /dev/null

          echo "OpenBao configured."

      - name: Store Harbor credentials in OpenBao
        run: |
          OPENBAO_ADDR="http://${RELEASE}-openbao.${NAMESPACE}.svc.cluster.local:8200"
          OPENBAO_TOKEN=$(kubectl get secret "${RELEASE}-openbao-init" \
            -n "${NAMESPACE}" -o jsonpath='{.data.root_token}' | base64 -d)

          # Enable KV secrets engine
          curl -s -X POST "${OPENBAO_ADDR}/v1/sys/mounts/secret" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"kv","options":{"version":"1"}}' > /dev/null 2>&1 || true

          curl -sf -X POST "${OPENBAO_ADDR}/v1/secret/harbor" \
            -H "X-Vault-Token: ${OPENBAO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${{ secrets.HARBOR_ADMIN_PASSWORD }}\"}" > /dev/null

          echo "Harbor credentials stored in OpenBao."

      - name: Mark installation complete
        run: |
          kubectl create configmap "${RELEASE}-platform-installed" \
            --namespace "${NAMESPACE}" \
            --from-literal=status=complete \
            --from-literal=timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  clusterfactory platform installation complete!          ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          kubectl get pods -n "${NAMESPACE}" | grep -v Completed
