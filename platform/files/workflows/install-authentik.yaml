name: Install Authentik

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NAMESPACE: ${{ secrets.CF_NAMESPACE }}
      KUBECONFIG: /etc/rancher/rke2/rke2.yaml

    steps:
      - name: Install tools (kubectl + helm)
        run: |
          set -euo pipefail
          if command -v apt-get &>/dev/null; then
            apt-get update -qq && apt-get install -yq curl
          fi
          curl -sfLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${{ secrets.KUBECTL_VERSION }}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -sf https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | DESIRED_VERSION="${{ secrets.HELM_VERSION }}" VERIFY_CHECKSUM=false bash
          kubectl version --client
          helm version --short

      - name: Verify cluster access
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes

      - name: Install authentik
        run: |
          set -euo pipefail

          SECRET_KEY="${{ secrets.AUTHENTIK_SECRET_KEY }}"
          PG_PASS="${{ secrets.AUTHENTIK_PG_PASSWORD }}"
          CF_HOST="${{ secrets.CF_HOST }}"
          CF_ACCESS_PORT="${{ secrets.CF_ACCESS_PORT }}"

          helm repo add authentik "${{ secrets.REPO_AUTHENTIK }}" --force-update
          helm repo update

          helm upgrade --install authentik authentik/authentik \
            --version "${{ secrets.AUTHENTIK_CHART_VERSION }}" \
            --namespace "${NAMESPACE}" \
            --set authentik.secret_key="${SECRET_KEY}" \
            --set authentik.error_reporting.enabled=false \
            --set authentik.postgresql.password="${PG_PASS}" \
            --set postgresql.enabled=true \
            --set postgresql.auth.password="${PG_PASS}" \
            --set server.ingress.enabled=true \
            --set server.ingress.ingressClassName=nginx \
            --set "server.ingress.hosts[0]=auth.${CF_HOST}" \
            --wait --timeout 15m

          echo "authentik installed."

      - name: Create TLS ingress for auth.CF_HOST
        run: |
          set -euo pipefail
          CF_HOST="${{ secrets.CF_HOST }}"

          # Patch the authentik ingress to add TLS (cert-manager selfsigned CA)
          kubectl patch ingress authentik-server -n "${NAMESPACE}" \
            --type=merge \
            -p "{
              \"metadata\": {
                \"annotations\": {
                  \"cert-manager.io/cluster-issuer\": \"clusterfactory-ca-issuer\",
                  \"nginx.ingress.kubernetes.io/ssl-redirect\": \"true\"
                }
              },
              \"spec\": {
                \"tls\": [{
                  \"hosts\": [\"auth.${CF_HOST}\"],
                  \"secretName\": \"authentik-tls\"
                }]
              }
            }"
          echo "TLS configured for auth.${CF_HOST}."

      - name: Wait for authentik to be ready
        run: |
          set -euo pipefail
          echo "Waiting for authentik server pod..."
          kubectl wait pod \
            -n "${NAMESPACE}" \
            -l app.kubernetes.io/component=server \
            --for=condition=Ready \
            --timeout=300s
          echo "Waiting for authentik worker pod..."
          kubectl wait pod \
            -n "${NAMESPACE}" \
            -l app.kubernetes.io/component=worker \
            --for=condition=Ready \
            --timeout=300s
          echo "authentik ready."

      - name: Verify
        run: |
          set -euo pipefail
          CF_HOST="${{ secrets.CF_HOST }}"
          CF_ACCESS_PORT="${{ secrets.CF_ACCESS_PORT }}"

          # Health check from inside the server pod
          AK_POD=$(kubectl get pod -n "${NAMESPACE}" \
            -l app.kubernetes.io/component=server \
            -o jsonpath='{.items[0].metadata.name}')

          for i in $(seq 1 20); do
            code=$(kubectl exec "${AK_POD}" -n "${NAMESPACE}" -- \
              curl -so /dev/null -w "%{http_code}" http://localhost:9000/-/health/live/ 2>/dev/null)
            [ "${code}" = "200" ] && break
            [ "$i" -eq 20 ] && { echo "ERROR: health check failed after 100s"; exit 1; }
            sleep 5
          done

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  authentik is ready!                                     ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Initial setup: https://auth.${CF_HOST}:${CF_ACCESS_PORT}/if/flow/initial-setup/"
          echo ""
          kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/name=authentik"
