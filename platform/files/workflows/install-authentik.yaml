name: Install Authentik

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KUBECONFIG: /etc/rancher/rke2/rke2.yaml

    steps:
      - name: Checkout repo
        run: |
          set -euo pipefail
          git clone http://clusterfactory-gitea-http.clusterfactory.svc.cluster.local:3000/clusterfactory/platform.git /tmp/cf-repo

      - name: Install tools (kubectl + helm)
        run: |
          set -euo pipefail
          if command -v apt-get &>/dev/null; then
            apt-get update -qq && apt-get install -yq curl
          fi
          source /tmp/cf-repo/VERSIONS.env
          curl -sfLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -sf https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | DESIRED_VERSION="${HELM_VERSION}" VERIFY_CHECKSUM=false bash
          kubectl version --client
          helm version --short

      - name: Detect AWS instance metadata
        run: |
          set -euo pipefail
          AK_HOST=$(curl -sf --max-time 5 http://169.254.169.254/latest/meta-data/local-hostname)
          INSTANCE_ID=$(curl -sf --max-time 5 http://169.254.169.254/latest/meta-data/instance-id)
          REGION=$(curl -sf --max-time 5 http://169.254.169.254/latest/meta-data/placement/region)
          echo "AK_HOST=${AK_HOST}"         >> "$GITHUB_ENV"
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "$GITHUB_ENV"
          echo "REGION=${REGION}"           >> "$GITHUB_ENV"
          echo "Host:        ${AK_HOST}"
          echo "Instance ID: ${INSTANCE_ID}"
          echo "Region:      ${REGION}"

      - name: Generate credentials
        run: |
          set -euo pipefail
          # Generate fresh credentials (idempotent — helm upgrade --install
          # will reuse existing release if already installed)
          SECRET_KEY=$(openssl rand 60 | base64 -w 0)
          PG_PASS=$(openssl rand 30 | base64 -w 0)
          echo "SECRET_KEY=${SECRET_KEY}" >> "$GITHUB_ENV"
          echo "PG_PASS=${PG_PASS}"       >> "$GITHUB_ENV"

      - name: Install authentik
        run: |
          set -euo pipefail
          source /tmp/cf-repo/VERSIONS.env

          helm repo add authentik "${REPO_AUTHENTIK}" --force-update
          helm repo update

          kubectl create namespace authentik --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install authentik authentik/authentik \
            --version "${AUTHENTIK_CHART_VERSION}" \
            --namespace authentik \
            --set authentik.secret_key="${SECRET_KEY}" \
            --set authentik.error_reporting.enabled=false \
            --set authentik.postgresql.password="${PG_PASS}" \
            --set postgresql.enabled=true \
            --set postgresql.auth.password="${PG_PASS}" \
            --set server.ingress.enabled=true \
            --set server.ingress.ingressClassName=nginx \
            --set "server.ingress.hosts[0]=${AK_HOST}" \
            --wait --timeout 15m

          echo "authentik installed."

      - name: Health check
        run: |
          set -euo pipefail
          AK_POD=$(kubectl get pod -n authentik \
            -l app.kubernetes.io/component=server \
            -o jsonpath='{.items[0].metadata.name}')

          echo "Waiting for health endpoint..."
          for i in $(seq 1 24); do
            code=$(kubectl exec "${AK_POD}" -n authentik -- \
              curl -so /dev/null -w "%{http_code}" \
              http://localhost:9000/-/health/live/ 2>/dev/null || echo "000")
            [ "${code}" = "200" ] && echo "Health: OK" && break
            [ "$i" -eq 24 ] && echo "ERROR: health check timed out" && exit 1
            sleep 5
          done

      - name: Print instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  authentik is ready                                              ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "── 1. SSM port-forward (run on your MacBook) ──────────────────────"
          echo ""
          echo "   aws ssm start-session \\"
          echo "     --target ${INSTANCE_ID} \\"
          echo "     --region ${REGION} \\"
          echo "     --document-name AWS-StartPortForwardingSession \\"
          echo "     --parameters '{\"portNumber\":[\"443\"],\"localPortNumber\":[\"8443\"]}'"
          echo ""
          echo "── 2. /etc/hosts on your MacBook ──────────────────────────────────"
          echo ""
          echo "   sudo sh -c 'echo \"127.0.0.1  ${AK_HOST}\" >> /etc/hosts'"
          echo ""
          echo "── 3. Open in browser ──────────────────────────────────────────────"
          echo ""
          echo "   https://${AK_HOST}:8443/if/flow/initial-setup/"
          echo ""
          echo "   Accept the self-signed cert warning (nginx default cert)."
          echo "   Set a password for the akadmin user."
          echo ""
          echo "── Pods ─────────────────────────────────────────────────────────────"
          kubectl get pods -n authentik
