---
# wiring-configmap.yaml
# Loads every file from wiring/ into a ConfigMap.
# The wiring Job mounts this ConfigMap and kubectl-applies each file.
# To add a new connection: add a file to wiring/ and redeploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-wiring
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook-weight: "-5"
data:
{{- range $path, $content := .Files.Glob "wiring/*.yaml" }}
  {{ base $path }}: |
{{ $content | toString | indent 4 }}
{{- end }}
