{{- if .Values.tls.enabled }}
# ClusterIssuer for cert-manager.
# cert-manager must be installed before this chart — bootstrap.sh handles that.
# Issuer type is controlled by tls.issuer:
#   selfsigned         → self-signed CA (no domain or email required)
#   letsencrypt-staging → Let's Encrypt staging ACME
#   letsencrypt         → Let's Encrypt production ACME

{{- if eq .Values.tls.issuer "selfsigned" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Self-signed CA certificate — used to back the selfsigned issuer for ingress TLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clusterfactory-ca
  namespace: {{ .Values.namespace | default .Release.Namespace }}
spec:
  isCA: true
  commonName: clusterfactory-ca
  secretName: clusterfactory-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: clusterfactory-ca-issuer
spec:
  ca:
    secretName: clusterfactory-ca-secret

{{- else if eq .Values.tls.issuer "letsencrypt-staging" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx

{{- else if eq .Values.tls.issuer "letsencrypt" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.email | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx

{{- end }}
{{- end }}
