{{- if .Values.cockpit.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cockpit-token
  namespace: {{ .Values.namespace | default .Release.Namespace }}
type: Opaque
stringData:
  token: {{ .Values.cockpit.token | required "cockpit.token is required — generate with: openssl rand -hex 32" | quote }}
{{- end }}
