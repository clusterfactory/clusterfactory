---
# wiring-job.yaml — Phase 3 (post-install hook, weight 10)
#
# PURPOSE: apply every file in wiring/ to the cluster, with runtime
# values from clusterfactory-wiring-tokens substituted in via sed.
#
# DEPENDENCY CHAIN:
#   Phase 1 (helm install) → Phase 2 (init-job, weight 0) → Phase 3 (this job, weight 10)
#
# The only input from Phase 2 is the clusterfactory-wiring-tokens Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wiring
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-wiring
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      restartPolicy: OnFailure
      containers:
        - name: wiring
          image: alpine/k8s:1.30.2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== clusterfactory wiring ==="

              # ── Wait for Phase 2 handoff Secret ───────────────────────────
              echo "Waiting for clusterfactory-wiring-tokens..."
              for i in $(seq 1 60); do
                kubectl get secret clusterfactory-wiring-tokens -n "$NS" > /dev/null 2>&1 && break
                echo "  [$i] not yet ready..."
                sleep 5
              done

              # ── Read runtime values ────────────────────────────────────────
              _get() { kubectl get secret clusterfactory-wiring-tokens -n "$NS" \
                         -o jsonpath="{.data.$1}" | base64 -d; }

              RUNNER_TOKEN=$(_get RUNNER_TOKEN)
              GITEA_TOKEN=$(_get GITEA_TOKEN)
              REPO_URL=$(_get REPO_URL)
              HARBOR_URL=$(_get HARBOR_URL)
              HARBOR_PASSWORD=$(_get HARBOR_PASSWORD)
              OPENBAO_TOKEN=$(_get OPENBAO_TOKEN)
              OPENBAO_ADDR=$(_get OPENBAO_ADDR)
              RELEASE_NAME="{{ .Release.Name }}"
              GITEA_USER="{{ .Values.gitea.gitea.admin.username }}"
              ARGOCD_NS="$NS"

              echo "Applying wiring files..."

              sed \
                -e "s|\\\$NS|${NS}|g" \
                -e "s|\\\$RELEASE_NAME|${RELEASE_NAME}|g" \
                -e "s|\\\$RUNNER_TOKEN|${RUNNER_TOKEN}|g" \
                -e "s|\\\$GITEA_USER|${GITEA_USER}|g" \
                /wiring/runner-token-secret.yaml | kubectl apply -f -

              sed \
                -e "s|\\\$NS|${NS}|g" \
                -e "s|\\\$ARGOCD_NS|${ARGOCD_NS}|g" \
                -e "s|\\\$REPO_URL|${REPO_URL}|g" \
                -e "s|\\\$GITEA_USER|${GITEA_USER}|g" \
                -e "s|\\\$GITEA_TOKEN|${GITEA_TOKEN}|g" \
                /wiring/argocd-repo-secret.yaml | kubectl apply -f -

              sed \
                -e "s|\\\$NS|${NS}|g" \
                -e "s|\\\$ARGOCD_NS|${ARGOCD_NS}|g" \
                -e "s|\\\$REPO_URL|${REPO_URL}|g" \
                /wiring/argocd-applications.yaml | kubectl apply -f -

              if [ "$HARBOR_ENABLED" = "true" ]; then
              sed \
                -e "s|\\\$NS|${NS}|g" \
                -e "s|\\\$HARBOR_URL|${HARBOR_URL}|g" \
                -e "s|\\\$HARBOR_PASSWORD|${HARBOR_PASSWORD}|g" \
                /wiring/harbor-pull-secret.yaml | kubectl apply -f -

              fi

              if [ "$OPENBAO_ENABLED" = "true" ]; then
              sed \
                -e "s|\\\$NS|${NS}|g" \
                -e "s|\\\$OPENBAO_ADDR|${OPENBAO_ADDR}|g" \
                -e "s|\\\$OPENBAO_TOKEN|${OPENBAO_TOKEN}|g" \
                /wiring/openbao-k8s-auth.yaml | kubectl apply -f -

              fi

              if [ "$CROSSPLANE_PROVIDERS_ENABLED" = "true" ]; then
              sed \
                -e "s|\\\$NS|${NS}|g" \
                /wiring/crossplane-providers.yaml | kubectl apply -f -

              fi

                            # ── Write wiring status for cockpit ───────────────────────────
              kubectl create configmap {{ .Release.Name }}-wiring-status \
                --namespace "$NS" \
                --from-literal=status="applied" \
                --from-literal=timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "=== clusterfactory wiring complete ==="
          env:
            - name: NS
              value: {{ .Values.namespace | default .Release.Namespace | quote }}
            - name: CROSSPLANE_PROVIDERS_ENABLED
              value: {{ .Values.crossplaneProviders.enabled | quote }}
            - name: HARBOR_ENABLED
              value: {{ .Values.harbor.enabled | quote }}
            - name: OPENBAO_ENABLED
              value: {{ .Values.openbao.enabled | quote }}
          volumeMounts:
            - name: wiring
              mountPath: /wiring
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: wiring
          configMap:
            name: {{ .Release.Name }}-wiring
