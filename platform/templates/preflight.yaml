{{- if and .Values.harbor.enabled (eq (.Values.harbor.harborAdminPassword | default "") "") }}
{{ fail "harbor.harborAdminPassword is required. Set it with --set harbor.harborAdminPassword=..." }}
{{- end }}

{{- if and .Values.gitea.enabled (eq (.Values.gitea.adminPassword | default "") "") }}
{{ fail "gitea.adminPassword is required. Set it with --set gitea.adminPassword=..." }}
{{- end }}

{{- if and .Values.cockpit.enabled (eq (.Values.cockpit.token | default "") "") }}
{{ fail "cockpit.token is required. Generate with: openssl rand -hex 32" }}
{{- end }}
