---
# init-job.yaml — Phase 2 (post-install hook, weight 0)
#
# PURPOSE: everything that requires the components to be running before wiring:
#   - wait for Gitea, create demo repo, push CI workflow
#   - obtain runner registration token
#   - create Gitea token for ArgoCD
#   - wait for Harbor, create clusterfactory project
#   - configure OpenBao (Kubernetes auth + policies + harbor creds)
#   - write clusterfactory-wiring-tokens Secret (handoff to Phase 3)
#
# The actual work is in files/gitea-init.sh, mounted via init-configmap.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-init
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      restartPolicy: OnFailure
      containers:
        - name: init
          image: alpine/k8s:1.30.2
          command:
            - /bin/sh
            - /scripts/gitea-init.sh
          env:
            - name: NS
              value: {{ .Values.namespace | default .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: GITEA_USER
              value: {{ .Values.gitea.gitea.admin.username | quote }}
            - name: GITEA_PASSWORD
              value: {{ .Values.gitea.gitea.admin.password | quote }}
            - name: GITEA_URL
              value: "http://{{ .Release.Name }}-gitea-http.{{ .Values.namespace | default .Release.Namespace }}.svc.cluster.local:3000"
            - name: HARBOR_URL
              value: "http://{{ .Release.Name }}-harbor-core.{{ .Values.namespace | default .Release.Namespace }}.svc.cluster.local"
            - name: HARBOR_PASSWORD
              value: {{ .Values.harbor.harborAdminPassword | quote }}
            - name: OPENBAO_ADDR
              value: "http://{{ .Release.Name }}-openbao.{{ .Values.namespace | default .Release.Namespace }}.svc.cluster.local:8200"
            - name: OPENBAO_TOKEN
              value: {{ .Values.openbao.server.dev.devRootToken | default "root" | quote }}
            - name: HARBOR_ENABLED
              value: {{ .Values.harbor.enabled | quote }}
            - name: OPENBAO_ENABLED
              value: {{ .Values.openbao.enabled | quote }}
            - name: HOST
              value: {{ .Values.host | default "localhost" | quote }}
            - name: SERVICE_TYPE
              value: {{ .Values.serviceType | default "NodePort" | quote }}
            - name: KUBECONFIG_SECRET
              value: {{ .Release.Name }}-kubeconfig
            {{- if .Values.debugForceEnv }}
            - name: DEBUG_FORCE_ENV
              value: {{ .Values.debugForceEnv | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-init-scripts
            defaultMode: 0755
