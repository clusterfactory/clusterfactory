{{- if .Values.ingress.enabled }}
# All browser-facing services behind a single nginx ingress (rke2-ingress-nginx).
# Hosts: *.{{ .Values.host }} — access via SSM port-forward to port 443.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- if .Values.tls.enabled }}
    {{- if eq .Values.tls.issuer "selfsigned" }}
    cert-manager.io/cluster-issuer: "clusterfactory-ca-issuer"
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- if (index .Values "authentik" | default dict).enabled }}
    # Custom auth approach: server-snippet defines /_ak-auth location with a single
    # proxy_set_header Host $host (no port). nginx ingress's built-in auth-url would
    # add a second Host header (service FQDN) causing Go HTTP server to return 400.
    nginx.ingress.kubernetes.io/server-snippet: |
      location = /_ak-auth {
        internal;
        proxy_pass http://{{ .Release.Name }}-authentik-server.{{ .Values.namespace | default .Release.Namespace }}.svc.cluster.local/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $pass_access_scheme;
        proxy_set_header X-Request-ID $req_id;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_request_buffering on;
      }
      location @ak-auth-redirect {
        set_by_lua_block $escaped_rd {
          return ngx.escape_uri(ngx.var.request_uri)
        }
        return 302 https://auth.{{ .Values.host }}:{{ .Values.accessPort }}/outpost.goauthentik.io/start?rd=$escaped_rd;
      }
    nginx.ingress.kubernetes.io/configuration-snippet: |
      auth_request /_ak-auth;
      auth_request_set $auth_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $auth_cookie;
      error_page 401 = @ak-auth-redirect;
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    {{- if .Values.gitea.enabled }}
    - gitea.{{ .Values.host }}
    {{- end }}
    - argocd.{{ .Values.host }}
    - harbor.{{ .Values.host }}
    - openbao.{{ .Values.host }}
    {{- if .Values.cockpit.enabled }}
    - cockpit.{{ .Values.host }}
    {{- end }}
    {{- if .Values.headlamp.enabled }}
    - headlamp.{{ .Values.host }}
    {{- end }}
    secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:

  {{- if .Values.gitea.enabled }}
  - host: gitea.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-gitea-http
            port:
              number: 3000
  {{- end }}

  # ArgoCD — installed by Gitea Actions workflow as release "clusterfactory-argo-cd"
  - host: argocd.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-argo-cd-argocd-server
            port:
              number: 8080

  # Harbor — installed by Gitea Actions workflow as release "clusterfactory-harbor"
  - host: harbor.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-harbor
            port:
              number: 80

  # OpenBao — installed by Gitea Actions workflow as release "clusterfactory-openbao"
  - host: openbao.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-openbao
            port:
              number: 8200

  {{- if .Values.headlamp.enabled }}
  - host: headlamp.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-headlamp
            port:
              number: {{ .Values.headlamp.port }}
  {{- end }}

  {{- if .Values.cockpit.enabled }}
  - host: cockpit.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-cockpit
            port:
              number: {{ .Values.cockpit.port }}
  {{- end }}

{{- if and .Values.cockpit.enabled .Values.cockpit.basicAuth.enabled .Values.cockpit.basicAuth.htpasswd }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Release.Name }}-cockpit-auth
    nginx.ingress.kubernetes.io/auth-realm: "clusterfactory cockpit"
    {{- if .Values.tls.enabled }}
    {{- if eq .Values.tls.issuer "selfsigned" }}
    cert-manager.io/cluster-issuer: "clusterfactory-ca-issuer"
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    - cockpit.{{ .Values.host }}
    secretName: {{ .Release.Name }}-cockpit-tls
  {{- end }}
  rules:
  - host: cockpit.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-cockpit
            port:
              number: {{ .Values.cockpit.port }}
{{- end }}

{{- if (index .Values "authentik" | default dict).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-authentik
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- if .Values.tls.enabled }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    - auth.{{ .Values.host }}
    secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:
  - host: auth.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-authentik-server
            port:
              number: 80
{{- end }}

{{- end }}
