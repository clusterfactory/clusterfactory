{{- if .Values.ingress.enabled }}
# All browser-facing services behind a single nginx ingress.
# Hosts: *.{{ .Values.host }} — on macOS, *.localhost resolves to 127.0.0.1 natively.
# Access via SSM port-forward to NodePort 30080, then open http://<service>.{{ .Values.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    {{- if .Values.tls.enabled }}
    {{- if eq .Values.tls.issuer "selfsigned" }}
    cert-manager.io/cluster-issuer: "clusterfactory-ca-issuer"
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
    {{- if index .Values "authentik" "enabled" }}
    nginx.ingress.kubernetes.io/auth-url: "https://auth.{{ .Values.host }}/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.{{ .Values.host }}/outpost.goauthentik.io/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-email"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    {{- if .Values.gitea.enabled }}
    - gitea.{{ .Values.host }}
    {{- end }}
    {{- if index .Values "argo-cd" "enabled" }}
    - argocd.{{ .Values.host }}
    {{- end }}
    {{- if .Values.harbor.enabled }}
    - harbor.{{ .Values.host }}
    {{- end }}
    {{- if .Values.openbao.enabled }}
    - openbao.{{ .Values.host }}
    {{- end }}
    {{- if .Values.cockpit.enabled }}
    - cockpit.{{ .Values.host }}
    {{- end }}
    {{- if .Values.headlamp.enabled }}
    - headlamp.{{ .Values.host }}
    {{- end }}
    secretName: {{ .Release.Name }}-tls
  {{- end }}
  rules:

  {{- if .Values.gitea.enabled }}
  - host: gitea.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-gitea-http
            port:
              number: 3000
  {{- end }}

  {{- if index .Values "argo-cd" "enabled" }}
  - host: argocd.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-argocd-server
            port:
              number: 8080
  {{- end }}

  {{- if .Values.harbor.enabled }}
  - host: harbor.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ index .Values "harbor" "expose" "nodePort" "name" | default "harbor" }}
            port:
              number: 80
  {{- end }}

  {{- if .Values.openbao.enabled }}
  - host: openbao.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-openbao
            port:
              number: 8200
  {{- end }}

  {{- if and .Values.cockpit.enabled (not (and .Values.cockpit.basicAuth.enabled .Values.cockpit.basicAuth.htpasswd)) }}
  - host: cockpit.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-cockpit
            port:
              number: {{ .Values.cockpit.port }}
  {{- end }}

  {{- if .Values.headlamp.enabled }}
  - host: headlamp.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-headlamp
            port:
              number: {{ .Values.headlamp.port }}
  {{- end }}

{{- if and .Values.cockpit.enabled .Values.cockpit.basicAuth.enabled .Values.cockpit.basicAuth.htpasswd }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ .Release.Name }}-cockpit-auth
    nginx.ingress.kubernetes.io/auth-realm: "clusterfactory cockpit"
    {{- if .Values.tls.enabled }}
    {{- if eq .Values.tls.issuer "selfsigned" }}
    cert-manager.io/cluster-issuer: "clusterfactory-ca-issuer"
    {{- else }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    - cockpit.{{ .Values.host }}
    secretName: {{ .Release.Name }}-cockpit-tls
  {{- end }}
  rules:
  - host: cockpit.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-cockpit
            port:
              number: {{ .Values.cockpit.port }}
{{- end }}

{{- if index .Values "authentik" "enabled" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-authentik
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    - auth.{{ .Values.host }}
    secretName: {{ .Release.Name }}-authentik-tls
  {{- end }}
  rules:
  - host: auth.{{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-authentik-server
            port:
              number: 9000
{{- end }}

{{- end }}
