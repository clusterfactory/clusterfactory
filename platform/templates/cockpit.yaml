{{- if .Values.cockpit.enabled }}
---
# cockpit.yaml — browser terminal + status dashboard
# Image ghcr.io/clusterfactory/cockpit:1.0 has node_modules + kubectl pre-installed.
# server.js, index.html, wiring.md are mounted as subPaths so they update with
# the chart without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  server.js: |
{{ .Files.Get "files/terminal/server.js" | indent 4 }}
  index.html: |
{{ .Files.Get "files/terminal/index.html" | indent 4 }}
  wiring.md: |
{{ .Files.Get "wiring/wiring.md" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-cockpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-cockpit
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      containers:
        - name: cockpit
          image: ghcr.io/clusterfactory/cockpit:1.0
          command: ["node", "/app/server.js"]
          env:
            - name: PORT
              value: "3000"
            - name: CONTROL_PLANE_HOST
              value: {{ .Values.host | quote }}
            - name: COCKPIT_TITLE
              value: {{ .Values.cockpit.title | default "clusterfactory" | quote }}
            - name: GITEA_URL
              value: "http://gitea.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: ARGOCD_URL
              value: "http://argocd.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: HEADLAMP_URL
              value: "http://headlamp.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: SHELL_CMD
              value: "/bin/sh"
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: NAMESPACE
              value: {{ .Values.namespace | default .Release.Namespace | quote }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: cockpit-config
              mountPath: /app/server.js
              subPath: server.js
            - name: cockpit-config
              mountPath: /app/index.html
              subPath: index.html
            - name: cockpit-config
              mountPath: /app/wiring.md
              subPath: wiring.md
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: cockpit-config
          configMap:
            name: {{ .Release.Name }}-cockpit
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
  ports:
    - port: {{ .Values.cockpit.port | default 4000 }}
      targetPort: 3000
      protocol: TCP
{{- end }}
