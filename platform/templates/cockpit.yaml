{{- if .Values.cockpit.enabled }}
---
# cockpit.yaml — browser terminal + status dashboard
# Files live in files/terminal/ and are embedded here via .Files.Get.
# An initContainer (node:20 Debian) installs npm deps + downloads kubectl into
# an emptyDir so the main container starts instantly with no compilation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  package.json: |
{{ .Files.Get "files/terminal/package.json" | indent 4 }}
  server.js: |
{{ .Files.Get "files/terminal/server.js" | indent 4 }}
  index.html: |
{{ .Files.Get "files/terminal/index.html" | indent 4 }}
  wiring.md: |
{{ .Files.Get "wiring/wiring.md" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-cockpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-cockpit
    spec:
      serviceAccountName: {{ .Release.Name }}-init
      initContainers:
        - name: npm-install
          image: node:20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cp /config/package.json /app/
              cp /config/server.js    /app/
              cp /config/index.html   /app/
              cp /config/wiring.md    /app/
              cd /app && npm install 2>&1
              # Download kubectl — detect arch so arm64 nodes work too
              # -k bypasses SSL verification (node:20 on ARM lacks system CA bundle)
              KUBECTL_VER=$(curl -sSLk https://dl.k8s.io/release/stable.txt)
              ARCH=$(uname -m); [ "$ARCH" = "aarch64" ] && ARCH="arm64" || ARCH="amd64"
              curl -sSLko /app/kubectl \
                "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/${ARCH}/kubectl"
              chmod +x /app/kubectl
          volumeMounts:
            - name: config
              mountPath: /config
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      containers:
        - name: cockpit
          image: node:20
          command:
            - sh
            - -c
            - |
              ln -sf /app/kubectl /usr/local/bin/kubectl
              exec node /app/server.js
          env:
            - name: PORT
              value: "3000"
            - name: CONTROL_PLANE_HOST
              value: {{ .Values.host | quote }}
            - name: COCKPIT_TITLE
              value: {{ .Values.cockpit.title | default "planectl management cluster" | quote }}
            - name: GITEA_URL
              value: "http://gitea.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: ARGOCD_URL
              value: "http://argocd.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: HEADLAMP_URL
              value: "http://headlamp.{{ .Values.host }}:{{ .Values.accessPort }}"
            - name: SHELL_CMD
              value: "/bin/bash --login"
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: NAMESPACE
              value: {{ .Values.namespace | default .Release.Namespace | quote }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: app
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-cockpit
        - name: app
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cockpit
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-cockpit
  ports:
    - port: {{ .Values.cockpit.port | default 4000 }}
      targetPort: 3000
      protocol: TCP
{{- end }}
