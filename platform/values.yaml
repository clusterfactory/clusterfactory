# clusterfactory — values (RKE2)
#
# Phase 1 (this chart): Gitea + act_runner + Cockpit + Headlamp + Ingress rules
# Phase 2 (Gitea Actions): ArgoCD, Harbor, OpenBao, Crossplane
#
# RKE2 ships rke2-ingress-nginx on hostPort 80/443 — no separate ingress-nginx needed.
# Access services via SSM port-forward to port 80, then http://<service>.localhost

host: localhost
namespace: clusterfactory

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true

# Port browsers use to reach services. RKE2 rke2-ingress-nginx binds hostPort 80.
# When using SSM port-forward, set this to your localPortNumber.
accessPort: 8443

# ── TLS ───────────────────────────────────────────────────────────────────────
tls:
  enabled: true
  issuer: selfsigned   # selfsigned | letsencrypt-staging | letsencrypt
  email: ""

# ── Cockpit (browser terminal) ────────────────────────────────────────────────
cockpit:
  enabled: true
  port: 4000
  title: "clusterfactory"
  basicAuth:
    enabled: false
    htpasswd: ""

# ── Headlamp (cluster UI) ─────────────────────────────────────────────────────
headlamp:
  enabled: true
  port: 4466

# ── Runner (Gitea Actions) ────────────────────────────────────────────────────
runner:
  enabled: true
  image: gitea/act_runner
  imageTag: "0.2.11"

# ── Gitea (installed as separate helm release by bootstrap.sh) ─────────────────
# These values control the Ingress rule and runner registration.
gitea:
  enabled: true
  adminUsername: admin
  adminPassword: ""    # required: --set gitea.adminPassword=...

