# clusterfactory — values
# Generated by wirectl on 2026-03-22.
#
# Components: Harbor, Gitea, OpenBao, Crossplane, ArgoCD
# Override: helm upgrade clusterfactory ./clusterfactory --set key=value

host: localhost
namespace: clusterfactory

# Controls service type for all browser-facing services.
# Override at install time:
#   --set serviceType=LoadBalancer   (cloud clusters: EKS, AKS, GKE)
#   --set serviceType=NodePort       (local clusters: Docker Desktop, kind, etc.)
serviceType: NodePort

# ── Ingress ───────────────────────────────────────────────────────────────────
# Single entry point for all services. NodePort 30080 on local clusters,
# LoadBalancer on cloud. One SSM port-forward tunnel covers everything.
# Hosts use *.localhost which resolves to 127.0.0.1 on macOS natively.
ingress-nginx:
  enabled: true
  controller:
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443

# Port used to reach services from the browser.
# Local/SSM: match the localPortNumber in your SSM port-forward command (default 8080).
# Cloud LoadBalancer: set to 80.
accessPort: 8080

cockpit:
  enabled: true
  port: 4000
  title: "clusterfactory"

# ── Headlamp (cluster UI) ─────────────────────────────────────────────────────
headlamp:
  enabled: true
  port: 4466

runner:
  enabled: true
  image: gitea/act_runner
  imageTag: "0.2.11"
  dockerSocket: /var/run/docker.sock

gitea:
  enabled: true
  gitea:
    admin:
      username: admin
      password: admin123
      email: admin@example.com
    config:
      actions:
        ENABLED: "true"
        DEFAULT_ACTIONS_URL: github
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  service:
    http:
      type: NodePort
  persistence:
    size: 5Gi
  postgresql:
    enabled: true
    primary:
      persistence:
        size: 2Gi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  valkey:
