# clusterfactory — values
# Generated by wirectl on 2026-03-22.
#
# Phase 1 (this chart): Gitea + act_runner + Cockpit + Headlamp + Ingress
# Phase 2 (Gitea Actions): ArgoCD, Harbor, OpenBao, Crossplane
#
# Override: helm upgrade clusterfactory ./platform --set key=value

host: localhost
namespace: clusterfactory

# Controls service type for all browser-facing services.
# Override at install time:
#   --set serviceType=LoadBalancer   (cloud clusters: EKS, AKS, GKE)
#   --set serviceType=NodePort       (local clusters: Docker Desktop, kind, etc.)
serviceType: NodePort

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true

ingress-nginx:
  enabled: true
  controller:
    admissionWebhooks:
      enabled: false
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443

# Port used to reach services from the browser.
# Default 30080 = ingress-nginx NodePort (Docker Desktop, kind, bare metal).
# RKE2: set accessPort=80 (rke2-ingress-nginx uses hostPort 80).
# SSM tunnel: override with --set accessPort=8080 (match your localPortNumber).
# Cloud LoadBalancer: override with --set accessPort=80.
accessPort: 30080

# ── TLS ───────────────────────────────────────────────────────────────────────
tls:
  enabled: false
  email: ""
  issuer: letsencrypt-staging

# ── Cockpit (browser terminal) ────────────────────────────────────────────────
cockpit:
  enabled: true
  port: 4000
  title: "clusterfactory"
  token: ""          # required: --set cockpit.token=$(openssl rand -hex 32)
  basicAuth:
    enabled: false
    htpasswd: ""     # --set cockpit.basicAuth.htpasswd="$(htpasswd -nb admin PASS)"

# ── Headlamp (cluster UI) ─────────────────────────────────────────────────────
headlamp:
  enabled: true
  port: 4466

# ── Runner (Gitea Actions) ────────────────────────────────────────────────────
runner:
  enabled: true
  image: gitea/act_runner
  imageTag: "0.2.11"

# ── Gitea (installed as separate helm release by bootstrap.sh) ─────────────────
# These values are used by ingresses.yaml and for preflight checks.
# The actual Gitea installation is: helm install clusterfactory-gitea gitea/gitea
gitea:
  enabled: true        # controls Ingress rule + runner
  adminUsername: admin
  adminPassword: ""    # required: --set gitea.adminPassword=...

# ── Platform component versions (installed by Gitea Actions workflow) ──────────
# These are stored as Gitea org secrets during bootstrap and used by the workflow.
workflow:
  argocdChartVersion: "7.8.28"
  harborChartVersion: "1.16.2"
  openbaoChartVersion: "0.5.0"
  crossplaneChartVersion: "1.18.5"
  harborAdminPassword: ""   # required: --set workflow.harborAdminPassword=...
