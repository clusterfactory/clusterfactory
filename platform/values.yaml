# clusterfactory — values
# Generated by wirectl on 2026-03-22.
#
# Components: Harbor, Gitea, OpenBao, Crossplane, ArgoCD
# Override: helm upgrade clusterfactory ./clusterfactory --set key=value

host: localhost
namespace: clusterfactory

# Controls service type for all browser-facing services.
# Override at install time:
#   --set serviceType=LoadBalancer   (cloud clusters: EKS, AKS, GKE)
#   --set serviceType=NodePort       (local clusters: Docker Desktop, kind, etc.)
serviceType: NodePort

# ── Ingress ───────────────────────────────────────────────────────────────────
# Single entry point for all services. NodePort 30080 on local clusters,
# LoadBalancer on cloud. One SSM port-forward tunnel covers everything.
# Hosts use *.localhost which resolves to 127.0.0.1 on macOS natively.
#
# ingress.enabled     — controls whether Ingress resources are created
# ingress-nginx.enabled — controls whether the bundled nginx controller is deployed
#   Set ingress-nginx.enabled=false on clusters with a pre-installed nginx controller
#   (e.g. RKE2 ships rke2-ingress-nginx). bootstrap.sh detects this automatically.
ingress:
  enabled: true

ingress-nginx:
  enabled: true
  controller:
    admissionWebhooks:
      enabled: false
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443

# Port used to reach services from the browser.
# Default 30080 = ingress-nginx NodePort (Docker Desktop, kind, bare metal).
# RKE2: set accessPort=80 (rke2-ingress-nginx uses hostPort 80).
# SSM tunnel: override with --set accessPort=8080 (match your localPortNumber).
# Cloud LoadBalancer: override with --set accessPort=80.
accessPort: 30080

# ── TLS ───────────────────────────────────────────────────────────────────────
# Requires cert-manager in the cluster (bootstrap.sh installs it automatically
# when TLS_EMAIL is set, or skip if already present).
#
# Usage:
#   TLS_EMAIL=you@example.com TLS_ISSUER=letsencrypt bash bootstrap.sh
#
# tls.issuer options:
#   selfsigned          — self-signed CA, no domain required (browser warns)
#   letsencrypt-staging — Let's Encrypt staging (safe for testing, not trusted)
#   letsencrypt         — Let's Encrypt production (trusted, real domain required)
tls:
  enabled: false
  email: ""
  issuer: letsencrypt-staging

cockpit:
  enabled: true
  port: 4000
  title: "clusterfactory"
  token: ""          # required: --set cockpit.token=$(openssl rand -hex 32)
  basicAuth:
    enabled: false
    htpasswd: ""     # --set cockpit.basicAuth.htpasswd="$(htpasswd -nb admin PASS)"

# ── Headlamp (cluster UI) ─────────────────────────────────────────────────────
headlamp:
  enabled: true
  port: 4466

runner:
  enabled: true
  image: gitea/act_runner
  imageTag: "0.2.11"

# ── Gitea (separate helm release) ─────────────────────────────────────────────
# Gitea is installed as a separate "clusterfactory-gitea" Helm release by
# bootstrap.sh to keep the main chart under K8s's 1MB release-secret limit.
# The service names produced are identical: clusterfactory-gitea-http, etc.
# These values are used by ingresses.yaml and runner.yaml for service discovery.
gitea:
  enabled: true   # controls Ingress rule + runner; does NOT install the subchart

argo-cd:
  enabled: true
  crds:
    install: false   # bootstrap.sh installs ArgoCD CRDs via kubectl (CRD YAML is 1MB+, breaks Helm release secret)
  configs:
    params:
      server.insecure: true
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    enabled: false
  server:
    service:
      type: ClusterIP
      servicePortHttp: 8080
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  controller:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

crossplaneProviders:
  enabled: false   # set true to install the Kubernetes provider via wiring

crossplane:
  enabled: true
  resourcesCrossplane:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  resourcesRBACManager:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

openbao:
  enabled: true
  server:
    dev:
      enabled: false
      devRootToken: ""      # only relevant in dev mode
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }
    dataStorage:
      enabled: true
      size: 1Gi
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

harbor:
  enabled: true
  expose:
    type: nodePort
    tls:
      enabled: false
  harborAdminPassword: ""           # required: --set harbor.harborAdminPassword=...
  persistence:
    enabled: true
  portal:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  core:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  jobservice:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  registry:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  trivy:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  nginx:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  database:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

authentik:
  enabled: false    # opt-in — set true for production SSO
  secret_key: ""    # required when enabled: --set authentik.secret_key=$(openssl rand -hex 32)
  postgresql:
    enabled: true
    auth:
      password: ""  # required when enabled
  redis:
    enabled: true

kyverno:
  enabled: false

falco:
  enabled: false
  falcosidekick:
    enabled: true
    config:
      slack:
        webhookurl: ""

velero:
  enabled: false

jenkins:
  enabled: false

keda:
  enabled: false
