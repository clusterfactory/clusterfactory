# platform — values
# Generated by wirectl on 2026-03-22.
#
# Components: Harbor, Gitea, OpenBao, Crossplane, ArgoCD
# Override: helm upgrade platform ./platform --set key=value

host: localhost
namespace: platform

cockpit:
  enabled: true
  port: 4000
  title: "clusterfactory"

# ── Headlamp (cluster UI) ─────────────────────────────────────────────────────
headlamp:
  enabled: true
  port: 4466

runner:
  enabled: true
  image: gitea/act_runner
  imageTag: "0.2.11"
  dockerSocket: /var/run/docker.sock

gitea:
  enabled: true
  gitea:
    admin:
      username: admin
      password: admin123
      email: admin@example.com
    config:
      actions:
        ENABLED: "true"
        DEFAULT_ACTIONS_URL: github
      server:
        ROOT_URL: http://localhost:30080
  service:
    http:
      type: NodePort
      nodePort: 30080
  persistence:
    size: 5Gi
  postgresql:
    enabled: true
    primary:
      persistence:
        size: 2Gi
  valkey:
    enabled: true
  valkey-cluster:
    enabled: false
  postgresql-ha:
    enabled: false

argo-cd:
  enabled: true
  configs:
    params:
      server.insecure: true
  dex:
    enabled: false
  notifications:
    enabled: false
  applicationSet:
    enabled: false
  server:
    service:
      type: LoadBalancer
      servicePortHttp: 8080

crossplaneProviders:
  enabled: false   # set true to install the Kubernetes provider via wiring

crossplane:
  enabled: true
  resourcesCrossplane:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

openbao:
  enabled: true
  server:
    dev:
      enabled: true       # dev mode: pre-initialized, NOT persistent
      devRootToken: "root"
    service:
      type: NodePort
      nodePort: 30820
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

harbor:
  enabled: true
  expose:
    type: nodePort
    nodePort:
      ports:
        http:
          nodePort: 30002
    tls:
      enabled: false
  externalURL: http://localhost:30002
  harborAdminPassword: "Harbor12345"
  persistence:
    enabled: true
  portal:
    resources:
      requests:
        cpu: 25m
  core:
    resources:
      requests:
        cpu: 25m
  jobservice:
    resources:
      requests:
        cpu: 25m
  registry:
    resources:
      requests:
        cpu: 25m

velero:
  enabled: false

jenkins:
  enabled: false

keda:
  enabled: false
