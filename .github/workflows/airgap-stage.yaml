name: Airgap stage

# Fetch every artifact an air-gapped install needs (RKE2 tarballs, SELinux
# RPMs, local-path, zarf + init package) on a CONNECTED hosted runner and
# stage them in the private GCS bucket the air-gapped VM can read through
# Private Google Access. The forge package itself is staged per run by the
# gate workflows. Re-run when a pinned version changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [hack/airgap-fetch.sh, hack/build-init-package.sh, rke2/**, .github/workflows/airgap-stage.yaml]

permissions:
  contents: read
  id-token: write

env:
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/local-path-provisioner
  LOCAL_PATH_VERSION: v0.0.37

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y skopeo >/dev/null
      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o zarf
          sudo install -m 755 zarf /usr/local/bin/zarf
      - name: Platform artifact set (manual runbook path) -> platform/${{ env.RKE2_VERSION }}
        run: hack/airgap-fetch.sh "gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}/platform/${RKE2_VERSION}"
      - name: Init package (ADR 0015) -> init/${{ env.ZARF_VERSION }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          (umask 077; printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key")
          SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD" hack/build-init-package.sh build
          rm -f "$RUNNER_TEMP/cosign.key"
          cd build && sha256sum zarf-init-amd64-*.tar.zst > "zarf-init-amd64-${ZARF_VERSION}.tar.zst.sha256"
          gcloud storage cp zarf-init-amd64-*.tar.zst* "gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}/init/${ZARF_VERSION}/"
