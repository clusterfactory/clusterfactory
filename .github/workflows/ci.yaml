name: CI

# docs/design.md §11 gates, in order; every gate must pass. Everything that needs
# a cluster runs on the self-hosted RKE2 runner (Rocky 9, SELinux enforcing,
# ADR 0014): there is no kind, nothing runs on a laptop.
#   1. lint      zarf dev lint, helm lint on helper charts, yamllint, OSCAL schema  (hosted)
#   2. create    zarf package create -f upstream; SBOMs; CVE gate; signing          (hosted)
#   3. rke2      clean RKE2 -> deploy the last main package -> upgrade to this one ->
#                full gate incl. the demo pipeline -> idempotent redeploy -> uninstall (self-hosted)
#   4. rke2-negative  RKE2 with cni=flannel and no StorageClass: the preflight must refuse it (self-hosted)
# Self-hosted jobs never run for pull requests from forks (public repo).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1
  # renovate: datasource=github-releases depName=rancher/local-path-provisioner
  LOCAL_PATH_VERSION: v0.0.37

jobs:
  zarf-lint:
    name: zarf dev lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: zarf dev lint
        # Package templates for the locally built images must be set for lint;
        # their values do not matter here.
        run: |
          T="--set PLUGINS_TAG=lint --set WIRE_ENGINE_TAG=lint --set LOCAL_REGISTRY=localhost:5001"
          zarf dev lint . -f upstream --no-color $T
          S=""
          for k in SHA_RKE2_TARBALL SHA_RKE2_IMAGES_CORE SHA_RKE2_IMAGES_CANAL SHA_RKE2_SUMS SHA_RKE2_SELINUX SHA_CONTAINER_SELINUX; do
            S="$S --set $k=lint"
          done
          touch rke2/files/local-path-storage.yaml rke2/files/local-path-provisioner.tar rke2/files/busybox.tar
          (cd rke2 && zarf dev lint . -f upstream --no-color $T $S --set CF_VERSION=lint)

  helm-lint:
    name: helm lint (helper charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: helm lint charts/*
        run: |
          found=0
          for chart in charts/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=1
            dir=$(dirname "$chart")
            echo "::group::helm lint $dir"
            helm lint "$dir" --strict
            helm template cf "$dir" >/dev/null
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no helper charts yet (charts/*/Chart.yaml) - skipping"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install yamllint==1.35.1
      - run: yamllint --strict -c .yamllint .

      - name: PREREQUISITES.md is generated from preflight.sh
        run: hack/gen-prerequisites.py && git diff --exit-code PREREQUISITES.md

  oscal-schema:
    name: OSCAL schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Locate oscal-component.yaml
        id: oscal
        run: |
          if [ -f oscal-component.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "oscal-component.yaml not present yet (docs/design.md §13 step 9) - skipping"
          fi

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        if: steps.oscal.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Validate against the OSCAL component-definition JSON schema
        if: steps.oscal.outputs.present == 'true'
        env:
          # renovate: datasource=github-releases depName=usnistgov/OSCAL
          OSCAL_VERSION: v1.1.2
        run: |
          pip install pyyaml jsonschema
          curl -sSfL "https://github.com/usnistgov/OSCAL/releases/download/${OSCAL_VERSION}/oscal_component_schema.json" -o /tmp/oscal_component_schema.json
          hack/oscal-validate.py /tmp/oscal_component_schema.json oscal-component.yaml

  create:
    name: zarf package create (upstream)
    runs-on: ubuntu-latest
    needs: [zarf-lint, helm-lint, yamllint, oscal-schema]
    outputs:
      signed: ${{ steps.create.outputs.signed }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Install Zarf and skopeo
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version
          sudo apt-get -qq update && sudo apt-get -qq install -y skopeo >/dev/null

      - name: Jenkins plugin lock is self-consistent (installs exactly plugins.lock)
        run: make plugins-lock-check

      - name: zarf package create -f upstream via make - builds the plugins and wire-engine images, signs
        id: create
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p build
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            # Secrets are absent on pull requests from forks; those packages stay unsigned
            # and the deploy job verifies only when a signature is present.
            (umask 077; printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key")
            make package OUT=build ZARF_CREATE_ARGS=--no-color SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
            make init-package OUT=build SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
            rm -f "$RUNNER_TEMP/cosign.key"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            make package OUT=build ZARF_CREATE_ARGS=--no-color
            make init-package OUT=build
          fi
          ls -lh build/

      - name: Inspect package definition
        run: zarf package inspect definition build/zarf-package-clusterfactory-*.tar.zst --no-color

      - name: Extract SBOMs
        id: sbom
        run: |
          mkdir -p sboms
          # No images yet -> no SBOMs; tolerate that until the first image lands.
          if zarf package inspect sbom build/zarf-package-clusterfactory-*.tar.zst --output sboms --no-color; then
            :
          else
            echo "no SBOMs extracted (package has no images yet)"
          fi
          COUNT=$(find sboms -type f -name '*.json' | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "SBOM files: ${COUNT}"

      - name: Upload SBOMs
        if: steps.sbom.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms
          path: sboms/
          retention-days: 14

      - name: Install grype
        if: steps.sbom.outputs.count != '0'
        uses: anchore/scan-action/download-grype@1638637db639e0ade3258b51db49a9a137574c3e  # v6.5.1
        id: grype

      - name: CVE gate over the SBOMs (policy in .grype.yaml, enforced by hack/cve-gate.py)
        env:
          GRYPE_CONFIG: .grype.yaml
        run: hack/cve-gate.py "${{ steps.grype.outputs.cmd }}" sboms "$GITHUB_STEP_SUMMARY"

      - name: Upload the forge package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: zarf-package-upstream
          path: build/zarf-package-clusterfactory-*.tar.zst
          retention-days: 5

      - name: Upload the all-in-one init package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: zarf-init-upstream
          path: build/zarf-init-amd64-*.tar.zst
          retention-days: 5

  rke2:
    name: all-in-one on a bare Rocky 9 host (SELinux) - zarf init, gate, upgrade, gate
    # The VM has no internet at all: packages come from the GCS bucket via
    # Private Google Access; this hosted job stages this run's packages there
    # and drives the VM over the IAP tunnel (no public IP, no SSH exposure).
    runs-on: ubuntu-latest
    needs: [create]
    # Needs the air-gapped rig (docs/ci.md); skipped unless the repo variable CF_RIG is 1.
    if: vars.CF_RIG == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 60
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ZONE: europe-west1-b
      VM: cf-runner-1
      BUCKET: gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Download this run's packages (all-in-one init + forge-only)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: zarf-*-upstream
          merge-multiple: true
          path: pkg

      - name: Previous packages (published to forge/main by the last green run on main) for the upgrade gate
        id: prev
        run: |
          if gcloud storage ls "$BUCKET/forge/main/zarf-init-amd64-*.tar.zst" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"; echo "no previous main packages - upgrade gate skipped"
          fi

      - name: Gate scripts to the VM over the IAP tunnel; the packages via the bucket (the tunnel drops gigabyte uploads)
        run: |
          gcloud storage cp pkg/zarf-init-amd64-*.tar.zst pkg/zarf-package-clusterfactory-*.tar.zst cosign.pub "$BUCKET/runs/${GITHUB_RUN_ID}/"
          mkdir -p run/bin
          cp hack/airgap-install.sh run/bin/
          cp tests/deploy-check.sh tests/snapshot-state.sh tests/compare-state.py run/bin/
          cp jenkins/plugins.txt run/bin/plugins.txt
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "rm -rf /tmp/cf-run"
          gcloud compute scp --recurse run "$VM:/tmp/cf-run" --zone "$ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo bash -s" <<'EOS'
          rm -rf /root/artifacts/run && mkdir -p /root/artifacts
          mv /tmp/cf-run /root/artifacts/run && chmod +x /root/artifacts/run/bin/*
          EOS

      - name: On the VM - clean host; the customer command on the all-in-one (N-1 if main has one, else N)
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<EOS
          set -euo pipefail; export PATH=\$PATH:/usr/local/bin:/var/lib/rancher/rke2/bin  # sudo secure_path lacks both
          A=/root/artifacts; mkdir -p \$A/run/new
          gcloud storage cp "$BUCKET/runs/${GITHUB_RUN_ID}/*" \$A/run/new/ >/dev/null 2>&1
          FROM=new
          if [ "${{ steps.prev.outputs.found }}" = "true" ]; then
            mkdir -p \$A/run/prev && gcloud storage cp "$BUCKET/forge/main/*" \$A/run/prev/ >/dev/null 2>&1; FROM=prev
          fi
          \$A/run/bin/airgap-install.sh down
          cd \$A/run/\$FROM && ls -lh
          timeout 2400 zarf init --confirm --no-color --key cosign.pub --set NEXUS_ACCEPT_CE_EULA=true 2>&1 \
            | grep -E "ERR|Verified|preflight ok|rke2 ready|init complete|wire engine"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          kubectl get nodes; kubectl get pods -A | grep -vE "Running|Completed" || true
          EOS

      - name: On the VM - gate the all-in-one; upgrade with the forge-only package N; gate; data survived; idempotent redeploy
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<EOS
          set -euo pipefail; export PATH=\$PATH:/usr/local/bin:/var/lib/rancher/rke2/bin  # sudo secure_path lacks both
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          A=/root/artifacts/run; cd \$A; mkdir -p ../gate/jenkins && cp bin/plugins.txt ../gate/jenkins/ && cp bin/*.sh bin/*.py ../gate/
          dep() {
            zarf package deploy "\$@" --confirm --no-color --timeout 15m --key new/cosign.pub --set NEXUS_ACCEPT_CE_EULA=true 2>&1 \\
              | grep -E "ERR|Verified|wire engine"
          }
          ../gate/deploy-check.sh clusterfactory
          if [ -d prev ]; then
            ../gate/snapshot-state.sh clusterfactory > before.json; cat before.json
            dep new/zarf-package-clusterfactory-*.tar.zst
            ../gate/deploy-check.sh clusterfactory
            ../gate/snapshot-state.sh clusterfactory > after.json; ../gate/compare-state.py before.json after.json
          fi
          dep new/zarf-package-clusterfactory-*.tar.zst
          EXPECT_IDEMPOTENT=1 ../gate/deploy-check.sh clusterfactory
          EOS

      - name: Diagnostics on failure
        if: failure()
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<'EOS' || true
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=$PATH:/var/lib/rancher/rke2/bin
          kubectl get pods -A -o wide; kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -40
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=80; journalctl -u rke2-server --no-pager -n 40
          EOS

      - name: Publish these packages as the new main packages (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          gcloud storage rm "$BUCKET/forge/main/*" >/dev/null 2>&1 || true
          gcloud storage cp pkg/zarf-init-amd64-*.tar.zst pkg/zarf-package-clusterfactory-*.tar.zst cosign.pub "$BUCKET/forge/main/"

      - name: On the VM - uninstall (clean host, caches kept)
        if: always()
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo bash /root/artifacts/run/bin/airgap-install.sh down; sudo rm -rf /root/artifacts/run /root/gate" || true
          gcloud storage rm -r "$BUCKET/runs/${GITHUB_RUN_ID}" || true

  rke2-negative:
    name: preflight refuses a broken cluster (RKE2 with flannel, no StorageClass)
    runs-on: ubuntu-latest
    needs: [rke2]
    # Needs the air-gapped rig (docs/ci.md); skipped unless the repo variable CF_RIG is 1.
    if: vars.CF_RIG == '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 30
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ZONE: europe-west1-b
      VM: cf-runner-1
      BUCKET: gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Install Zarf and build the preflight-only package
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o zarf
          sudo install -m 755 zarf /usr/local/bin/zarf
          zarf package create preflight -f upstream --confirm --no-color --skip-sbom -o build
          mkdir -p run
          cp build/zarf-package-clusterfactory-preflight-*.tar.zst run/
          cp hack/airgap-install.sh tests/preflight-negative.sh run/
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "rm -rf /tmp/cf-run"
          gcloud compute scp --recurse run "$VM:/tmp/cf-run" --zone "$ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo bash -s" <<'EOS'
          rm -rf /root/artifacts/run && mkdir -p /root/artifacts
          mv /tmp/cf-run /root/artifacts/run && chmod +x /root/artifacts/run/*.sh
          EOS

      - name: On the VM - RKE2 with flannel, no StorageClass; preflight must refuse
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<EOS
          set -euo pipefail; export PATH=\$PATH:/usr/local/bin:/var/lib/rancher/rke2/bin  # sudo secure_path lacks both
          A=/root/artifacts
          mkdir -p \$A/platform && gcloud storage rsync "$BUCKET/platform/${{ env.RKE2_VERSION }}" \$A/platform/${{ env.RKE2_VERSION }} >/dev/null 2>&1
          # flannel -> no NetworkPolicy enforcement. local-path must exist for zarf init's PVC;
          # the default-class annotation is removed afterwards so the preflight sees no default.
          CNI=flannel ARTIFACT_DIR=\$A/platform/${{ env.RKE2_VERSION }} \$A/run/airgap-install.sh up
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=\$PATH:/var/lib/rancher/rke2/bin:/usr/local/bin
          kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class-
          kubectl get pods -n zarf
          cd \$A/run && ./preflight-negative.sh zarf-package-clusterfactory-preflight-*.tar.zst networkpolicy-enforcement,default-storageclass
          EOS

      - name: On the VM - uninstall
        if: always()
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo bash /root/artifacts/run/airgap-install.sh down; sudo rm -rf /root/artifacts/run" || true
