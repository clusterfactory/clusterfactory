name: CI

# uds-way.md §11 gates, in order; every gate must pass:
#   1. lint    zarf dev lint, helm lint on helper charts, yamllint, OSCAL schema
#   2. create  zarf package create -f upstream on a connected runner; SBOMs; CVE scan
#   3. deploy  kind + Calico, default-deny egress, zarf init, deploy, tests/deploy-check.sh
#   4. functional  demo pipeline: pod agent, Kaniko build, push to Nexus (inside deploy-check.sh)
#   5. upgrade  deploy the last package built from main, then this one over it; data survives
#   3b preflight-negative  every contract check seen failing on a deliberately broken cluster
#   6. rke2 (step 10)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0

jobs:
  zarf-lint:
    name: zarf dev lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: zarf dev lint
        # Package templates for the locally built images must be set for lint;
        # their values do not matter here.
        run: zarf dev lint . -f upstream --no-color --set PLUGINS_TAG=lint --set WIRE_ENGINE_TAG=lint --set LOCAL_REGISTRY=localhost:5001

  helm-lint:
    name: helm lint (helper charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: helm lint charts/*
        run: |
          found=0
          for chart in charts/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=1
            dir=$(dirname "$chart")
            echo "::group::helm lint $dir"
            helm lint "$dir" --strict
            helm template cf "$dir" >/dev/null
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no helper charts yet (charts/*/Chart.yaml) - skipping"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install yamllint==1.35.1
      - run: yamllint --strict -c .yamllint .

      - name: PREREQUISITES.md is generated from preflight.sh
        run: hack/gen-prerequisites.py && git diff --exit-code PREREQUISITES.md

  oscal-schema:
    name: OSCAL schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Locate oscal-component.yaml
        id: oscal
        run: |
          if [ -f oscal-component.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "oscal-component.yaml not present yet (uds-way.md §13 step 9) - skipping"
          fi

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        if: steps.oscal.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Validate against the OSCAL component-definition JSON schema
        if: steps.oscal.outputs.present == 'true'
        env:
          # renovate: datasource=github-releases depName=usnistgov/OSCAL
          OSCAL_VERSION: v1.1.2
        run: |
          pip install pyyaml jsonschema
          curl -sSfL "https://github.com/usnistgov/OSCAL/releases/download/${OSCAL_VERSION}/oscal_component_schema.json" -o /tmp/oscal_component_schema.json
          hack/oscal-validate.py /tmp/oscal_component_schema.json oscal-component.yaml

  create:
    name: zarf package create (upstream)
    runs-on: ubuntu-latest
    needs: [zarf-lint, helm-lint, yamllint, oscal-schema]
    outputs:
      signed: ${{ steps.create.outputs.signed }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Jenkins plugin lock is self-consistent (installs exactly plugins.lock)
        run: make plugins-lock-check

      - name: zarf package create -f upstream via make - builds the plugins and wire-engine images, signs
        id: create
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p build
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            # Secrets are absent on pull requests from forks; those packages stay unsigned
            # and the deploy job verifies only when a signature is present.
            (umask 077; printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key")
            make package OUT=build ZARF_CREATE_ARGS=--no-color SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
            rm -f "$RUNNER_TEMP/cosign.key"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            make package OUT=build ZARF_CREATE_ARGS=--no-color
          fi
          ls -lh build/

      - name: Inspect package definition
        run: zarf package inspect definition build/zarf-package-clusterfactory-*.tar.zst --no-color

      - name: Extract SBOMs
        id: sbom
        run: |
          mkdir -p sboms
          # No images yet -> no SBOMs; tolerate that until the first image lands.
          if zarf package inspect sbom build/zarf-package-clusterfactory-*.tar.zst --output sboms --no-color; then
            :
          else
            echo "no SBOMs extracted (package has no images yet)"
          fi
          COUNT=$(find sboms -type f -name '*.json' | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "SBOM files: ${COUNT}"

      - name: Upload SBOMs
        if: steps.sbom.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms
          path: sboms/
          retention-days: 14

      - name: Install grype
        if: steps.sbom.outputs.count != '0'
        uses: anchore/scan-action/download-grype@1638637db639e0ade3258b51db49a9a137574c3e  # v6.5.1
        id: grype

      - name: CVE gate over the SBOMs (policy in .grype.yaml, enforced by hack/cve-gate.py)
        env:
          GRYPE_CONFIG: .grype.yaml
        run: hack/cve-gate.py "${{ steps.grype.outputs.cmd }}" sboms "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: zarf-package-upstream
          path: build/zarf-package-clusterfactory-*.tar.zst
          retention-days: 5

  deploy:
    name: airgapped deploy (kind + Calico)
    # Gitea + Jenkins + Nexus + a Kaniko build need more than the 7 GB of
    # ubuntu-latest; switch to a larger runner if this starts thrashing.
    runs-on: ubuntu-latest
    needs: [create]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          INIT="zarf-init-amd64-${ZARF_VERSION}.tar.zst"
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/${INIT}" -o "${INIT}"

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3  # v1.12.0
        with:
          install_only: true

      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: zarf-package-upstream
          path: build

      - name: Stand up the egress-blocked cluster (kind + Calico + zarf init + deny egress)
        run: bundle/up.sh .

      - name: zarf package deploy - signature verified when the package is signed
        run: |
          KEY=""
          if [ "${{ needs.create.outputs.signed }}" = "true" ]; then
            KEY="--key cosign.pub"; echo "package is signed - verifying with cosign.pub"
          fi
          zarf package deploy build/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 15m $KEY --set NEXUS_ACCEPT_CE_EULA=true

      - name: Gate 3 checks
        run: tests/deploy-check.sh clusterfactory

      - name: Redeploy over the converged cluster (wire engine must be idempotent)
        run: |
          zarf package deploy build/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 15m --set NEXUS_ACCEPT_CE_EULA=true
          EXPECT_IDEMPOTENT=1 tests/deploy-check.sh clusterfactory

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -50
          for p in $(kubectl get pods -n clusterfactory -o name); do
            echo "::group::$p"
            kubectl describe -n clusterfactory "$p" | tail -40
            kubectl logs -n clusterfactory "$p" --all-containers --tail=100 || true
            echo "::endgroup::"
          done

  upgrade:
    name: upgrade N-1 -> N (kind + Calico)
    # Gate 5: the previous package (latest successful build on main) first,
    # then this one over it. Demo data - repo commits, Jenkins builds, Nexus
    # tags - must survive and the wire engine must converge.
    runs-on: ubuntu-latest
    needs: [create]
    if: github.event_name == 'pull_request'
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          INIT="zarf-init-amd64-${ZARF_VERSION}.tar.zst"
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/${INIT}" -o "${INIT}"

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3  # v1.12.0
        with:
          install_only: true

      - name: Download the previous package (latest successful CI run on main)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ]; then echo "no successful main run yet - skipping upgrade gate"; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p prev
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n zarf-package-upstream -D prev
          # the artifact root is the package file itself (no build/ prefix)
          PREV=$(find prev -name 'zarf-package-clusterfactory-*.tar.zst' | head -1)
          test -n "$PREV" || { echo "previous package not found in artifact"; find prev; exit 1; }
          ls -lh "$PREV"
          echo "path=$PREV" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Download this package
        if: steps.prev.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: zarf-package-upstream
          path: build

      - name: Stand up the egress-blocked cluster
        if: steps.prev.outputs.found == 'true'
        run: bundle/up.sh .

      - name: Deploy N-1 and seed data
        if: steps.prev.outputs.found == 'true'
        run: |
          zarf package deploy "${{ steps.prev.outputs.path }}" --confirm --no-color --timeout 15m --set NEXUS_ACCEPT_CE_EULA=true
          tests/deploy-check.sh clusterfactory
          tests/snapshot-state.sh clusterfactory > before.json
          cat before.json

      - name: Upgrade to N
        if: steps.prev.outputs.found == 'true'
        run: |
          KEY=""; [ "${{ needs.create.outputs.signed }}" = "true" ] && KEY="--key cosign.pub"
          zarf package deploy build/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 20m $KEY --set NEXUS_ACCEPT_CE_EULA=true
          tests/deploy-check.sh clusterfactory
          tests/snapshot-state.sh clusterfactory > after.json
          cat after.json
          tests/compare-state.py before.json after.json

      - name: Diagnostics on failure
        if: failure() && steps.prev.outputs.found == 'true'
        run: |
          kubectl get pods -A -o wide
          kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -50
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=100 || true

  preflight-negative:
    name: preflight refuses a broken cluster (flannel, no default StorageClass)
    runs-on: ubuntu-latest
    needs: [zarf-lint, helm-lint, yamllint, oscal-schema]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          INIT="zarf-init-amd64-${ZARF_VERSION}.tar.zst"
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/${INIT}" -o "${INIT}"

      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3  # v1.12.0
        with:
          install_only: true

      - name: kind with plain flannel (no NetworkPolicy enforcement), zarf init, default StorageClass removed
        run: |
          kind create cluster --config bundle/kind-config-flannel.yaml --wait 120s
          # renovate: datasource=github-releases depName=flannel-io/flannel
          FLANNEL_VERSION=v0.28.9
          kubectl apply -f "https://github.com/flannel-io/flannel/releases/download/${FLANNEL_VERSION}/kube-flannel.yml"
          kubectl -n kube-flannel rollout status ds/kube-flannel-ds --timeout=300s
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl -n kube-system rollout status deploy/coredns --timeout=300s
          zarf init --confirm --no-color
          kubectl annotate storageclass standard storageclass.kubernetes.io/is-default-class-

      - name: Build the preflight-only package
        run: zarf package create preflight -f upstream --confirm --no-color --skip-sbom -o build

      - name: Preflight must fail on exactly the broken checks
        run: tests/preflight-negative.sh build/zarf-package-clusterfactory-preflight-*.tar.zst networkpolicy-enforcement,default-storageclass

      - name: Diagnostics on failure
        if: failure()
        run: |
          cat preflight-negative.out || true
          kubectl get pods -A -o wide
