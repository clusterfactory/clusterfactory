name: CI

# uds-way.md §11 gates, in order; every gate must pass. Everything that needs
# a cluster runs on the self-hosted RKE2 runner (Rocky 9, SELinux enforcing,
# ADR 0014): there is no kind, nothing runs on a laptop.
#   1. lint      zarf dev lint, helm lint on helper charts, yamllint, OSCAL schema  (hosted)
#   2. create    zarf package create -f upstream; SBOMs; CVE gate; signing          (hosted)
#   3. rke2      clean RKE2 -> deploy the last main package -> upgrade to this one ->
#                full gate incl. the demo pipeline -> idempotent redeploy -> uninstall (self-hosted)
#   4. rke2-negative  RKE2 with cni=flannel and no StorageClass: the preflight must refuse it (self-hosted)
# Self-hosted jobs never run for pull requests from forks (public repo).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1
  # renovate: datasource=github-releases depName=rancher/local-path-provisioner
  LOCAL_PATH_VERSION: v0.0.37

jobs:
  zarf-lint:
    name: zarf dev lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: zarf dev lint
        # Package templates for the locally built images must be set for lint;
        # their values do not matter here.
        run: zarf dev lint . -f upstream --no-color --set PLUGINS_TAG=lint --set WIRE_ENGINE_TAG=lint --set LOCAL_REGISTRY=localhost:5001

  helm-lint:
    name: helm lint (helper charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: helm lint charts/*
        run: |
          found=0
          for chart in charts/*/Chart.yaml; do
            [ -f "$chart" ] || continue
            found=1
            dir=$(dirname "$chart")
            echo "::group::helm lint $dir"
            helm lint "$dir" --strict
            helm template cf "$dir" >/dev/null
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no helper charts yet (charts/*/Chart.yaml) - skipping"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'
      - run: pip install yamllint==1.35.1
      - run: yamllint --strict -c .yamllint .

      - name: PREREQUISITES.md is generated from preflight.sh
        run: hack/gen-prerequisites.py && git diff --exit-code PREREQUISITES.md

  oscal-schema:
    name: OSCAL schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Locate oscal-component.yaml
        id: oscal
        run: |
          if [ -f oscal-component.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "oscal-component.yaml not present yet (uds-way.md §13 step 9) - skipping"
          fi

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        if: steps.oscal.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Validate against the OSCAL component-definition JSON schema
        if: steps.oscal.outputs.present == 'true'
        env:
          # renovate: datasource=github-releases depName=usnistgov/OSCAL
          OSCAL_VERSION: v1.1.2
        run: |
          pip install pyyaml jsonschema
          curl -sSfL "https://github.com/usnistgov/OSCAL/releases/download/${OSCAL_VERSION}/oscal_component_schema.json" -o /tmp/oscal_component_schema.json
          hack/oscal-validate.py /tmp/oscal_component_schema.json oscal-component.yaml

  create:
    name: zarf package create (upstream)
    runs-on: ubuntu-latest
    needs: [zarf-lint, helm-lint, yamllint, oscal-schema]
    outputs:
      signed: ${{ steps.create.outputs.signed }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Install Zarf
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Jenkins plugin lock is self-consistent (installs exactly plugins.lock)
        run: make plugins-lock-check

      - name: zarf package create -f upstream via make - builds the plugins and wire-engine images, signs
        id: create
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p build
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            # Secrets are absent on pull requests from forks; those packages stay unsigned
            # and the deploy job verifies only when a signature is present.
            (umask 077; printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key")
            make package OUT=build ZARF_CREATE_ARGS=--no-color SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
            rm -f "$RUNNER_TEMP/cosign.key"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            make package OUT=build ZARF_CREATE_ARGS=--no-color
          fi
          ls -lh build/

      - name: Inspect package definition
        run: zarf package inspect definition build/zarf-package-clusterfactory-*.tar.zst --no-color

      - name: Extract SBOMs
        id: sbom
        run: |
          mkdir -p sboms
          # No images yet -> no SBOMs; tolerate that until the first image lands.
          if zarf package inspect sbom build/zarf-package-clusterfactory-*.tar.zst --output sboms --no-color; then
            :
          else
            echo "no SBOMs extracted (package has no images yet)"
          fi
          COUNT=$(find sboms -type f -name '*.json' | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "SBOM files: ${COUNT}"

      - name: Upload SBOMs
        if: steps.sbom.outputs.count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms
          path: sboms/
          retention-days: 14

      - name: Install grype
        if: steps.sbom.outputs.count != '0'
        uses: anchore/scan-action/download-grype@1638637db639e0ade3258b51db49a9a137574c3e  # v6.5.1
        id: grype

      - name: CVE gate over the SBOMs (policy in .grype.yaml, enforced by hack/cve-gate.py)
        env:
          GRYPE_CONFIG: .grype.yaml
        run: hack/cve-gate.py "${{ steps.grype.outputs.cmd }}" sboms "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: zarf-package-upstream
          path: build/zarf-package-clusterfactory-*.tar.zst
          retention-days: 5

  rke2:
    name: forge on RKE2 (Rocky 9, SELinux) - deploy, upgrade, gate
    runs-on: [self-hosted, rke2, rocky9]
    needs: [create]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: ./.github/actions/rke2-up
        with:
          rke2-version: ${{ env.RKE2_VERSION }}
          zarf-version: ${{ env.ZARF_VERSION }}
          local-path-version: ${{ env.LOCAL_PATH_VERSION }}

      - name: Download this package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: zarf-package-upstream
          path: pkg

      - name: Previous package (latest successful CI run on main) for the upgrade gate
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN" ]; then echo "found=false" >> "$GITHUB_OUTPUT"; echo "no successful main run yet - upgrade gate skipped"; exit 0; fi
          mkdir -p prev && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n zarf-package-upstream -D prev
          PREV=$(find prev -name 'zarf-package-clusterfactory-*.tar.zst' | head -1)
          [ -n "$PREV" ] && { echo "path=$PREV" >> "$GITHUB_OUTPUT"; echo "found=true" >> "$GITHUB_OUTPUT"; } || echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Deploy N-1 and seed data
        if: steps.prev.outputs.found == 'true'
        run: |
          zarf package deploy "${{ steps.prev.outputs.path }}" --confirm --no-color --timeout 12m --set NEXUS_ACCEPT_CE_EULA=true
          tests/deploy-check.sh clusterfactory
          tests/snapshot-state.sh clusterfactory > before.json && cat before.json

      - name: Deploy this package (signature verified when signed)
        run: |
          KEY=""; [ "${{ needs.create.outputs.signed }}" = "true" ] && KEY="--key cosign.pub"
          zarf package deploy pkg/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 12m $KEY --set NEXUS_ACCEPT_CE_EULA=true

      - name: Full gate (contract, wiring, demo pipeline, egress)
        run: tests/deploy-check.sh clusterfactory

      - name: Upgrade kept the data
        if: steps.prev.outputs.found == 'true'
        run: tests/snapshot-state.sh clusterfactory > after.json && cat after.json && tests/compare-state.py before.json after.json

      - name: Redeploy must be idempotent
        run: |
          KEY=""; [ "${{ needs.create.outputs.signed }}" = "true" ] && KEY="--key cosign.pub"
          zarf package deploy pkg/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 12m $KEY --set NEXUS_ACCEPT_CE_EULA=true
          EXPECT_IDEMPOTENT=1 tests/deploy-check.sh clusterfactory

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -40 || true
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=100 || true
          sudo journalctl -u rke2-server --no-pager -n 40 || true

      - uses: ./.github/actions/rke2-down
        if: always()

  rke2-negative:
    name: preflight refuses a broken cluster (RKE2 with flannel, no StorageClass)
    runs-on: [self-hosted, rke2, rocky9]
    needs: [rke2]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 25
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: ./.github/actions/rke2-up
        with:
          rke2-version: ${{ env.RKE2_VERSION }}
          zarf-version: ${{ env.ZARF_VERSION }}
          local-path-version: ${{ env.LOCAL_PATH_VERSION }}
          cni: flannel
          storageclass: "false"

      - name: Preflight-only package
        run: zarf package create preflight -f upstream --confirm --no-color --skip-sbom -o build

      - name: Preflight must fail on exactly networkpolicy-enforcement and default-storageclass
        run: tests/preflight-negative.sh build/zarf-package-clusterfactory-preflight-*.tar.zst networkpolicy-enforcement,default-storageclass

      - name: Diagnostics on failure
        if: failure()
        run: |
          cat preflight-negative.out || true
          kubectl get pods -A -o wide || true

      - uses: ./.github/actions/rke2-down
        if: always()
