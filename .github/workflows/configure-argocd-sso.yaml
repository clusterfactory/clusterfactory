name: Configure ArgoCD SSO

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KUBECONFIG: /etc/rancher/rke2/rke2.yaml
      CF_NAMESPACE: ${{ vars.CF_NAMESPACE || 'clusterfactory' }}
      CF_RELEASE:   ${{ vars.CF_RELEASE   || 'clusterfactory' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load commands
        run: |
          set -euo pipefail
          # Decode all kubectl/python commands from commands.json.
          # Keeps multi-line and quote-heavy strings out of the workflow YAML.
          CMD_FILE=".github/commands.json"

          decode() {
            python3 -c "
import base64, json, sys
d = json.load(open('${CMD_FILE}'))
print(base64.b64decode(d[sys.argv[1]]).decode())
" "$1"
          }

          # Write decoded commands to GITHUB_ENV using heredoc syntax
          # so multiline values (python script) survive correctly
          {
            echo "GET_AK_POD=$(decode get_ak_pod)"
            echo "GET_AK_CLUSTERIP=$(decode get_ak_clusterip)"
            echo "GET_AK_HOST=$(decode get_ak_host)"
            echo "RESTART_ARGOCD=$(decode restart_argocd)"
            echo "ROLLOUT_STATUS_ARGOCD=$(decode rollout_status_argocd)"
            echo "GET_AK_TOKEN_PY<<__EOF__"
            decode get_ak_token_python
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Bootstrap Authentik API token
        run: |
          set -euo pipefail

          AK_POD=$(eval "${GET_AK_POD}")
          AK_TOKEN=$(kubectl exec "${AK_POD}" -n authentik -- \
            python -m manage shell -c "${GET_AK_TOKEN_PY}" 2>/dev/null | tail -1)
          AK_IP=$(eval "${GET_AK_CLUSTERIP}")
          AK_HOST=$(eval "${GET_AK_HOST}")

          echo "AK_POD=${AK_POD}"       >> "$GITHUB_ENV"
          echo "AK_TOKEN=${AK_TOKEN}"   >> "$GITHUB_ENV"
          echo "AK_IP=${AK_IP}"         >> "$GITHUB_ENV"
          echo "AK_HOST=${AK_HOST}"     >> "$GITHUB_ENV"
          echo "AK_URL=http://${AK_IP}" >> "$GITHUB_ENV"
          echo "Authentik API: http://${AK_IP} (ingress host: ${AK_HOST})"

      - name: Get flow UUIDs
        run: |
          set -euo pipefail

          _flow() {
            curl -sf \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              "${AK_URL}/api/v3/flows/instances/?slug=$1" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['pk'])"
          }

          AUTH_FLOW=$( _flow default-authentication-flow)
          AUTHZ_FLOW=$(_flow default-provider-authorization-implicit-consent)
          INVAL_FLOW=$(_flow default-provider-invalidation-flow)

          echo "AUTH_FLOW=${AUTH_FLOW}"   >> "$GITHUB_ENV"
          echo "AUTHZ_FLOW=${AUTHZ_FLOW}" >> "$GITHUB_ENV"
          echo "INVAL_FLOW=${INVAL_FLOW}" >> "$GITHUB_ENV"
          echo "Auth:  ${AUTH_FLOW}"
          echo "Authz: ${AUTHZ_FLOW}"
          echo "Inval: ${INVAL_FLOW}"

      - name: Create OIDC Provider (idempotent)
        run: |
          set -euo pipefail

          EXISTING=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/providers/oauth2/?name=argocd" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['results'][0]['pk'] if r['count'] > 0 else '')")

          if [ -n "${EXISTING}" ]; then
            echo "Provider exists (pk=${EXISTING}), reading credentials."
            RESULT=$(curl -sf \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              "${AK_URL}/api/v3/providers/oauth2/${EXISTING}/")
          else
            RESULT=$(curl -sf -X POST \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              -H "Content-Type: application/json" \
              "${AK_URL}/api/v3/providers/oauth2/" \
              -d "{
                \"name\": \"argocd\",
                \"authentication_flow\": \"${AUTH_FLOW}\",
                \"authorization_flow\": \"${AUTHZ_FLOW}\",
                \"invalidation_flow\": \"${INVAL_FLOW}\",
                \"client_type\": \"confidential\",
                \"redirect_uris\": [{\"matching_mode\": \"strict\", \"url\": \"https://${AK_HOST}/auth/callback\"}],
                \"sub_mode\": \"hashed_user_id\"
              }")
            echo "Provider created."
          fi

          PROVIDER_PK=$(   echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin)['pk'])")
          CLIENT_ID=$(     echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin)['client_id'])")
          CLIENT_SECRET=$( echo "${RESULT}" | python3 -c "import sys,json; print(json.load(sys.stdin)['client_secret'])")

          echo "PROVIDER_PK=${PROVIDER_PK}"     >> "$GITHUB_ENV"
          echo "CLIENT_ID=${CLIENT_ID}"         >> "$GITHUB_ENV"
          echo "CLIENT_SECRET=${CLIENT_SECRET}" >> "$GITHUB_ENV"
          echo "Provider PK: ${PROVIDER_PK} / Client ID: ${CLIENT_ID}"

      - name: Create Application (idempotent)
        run: |
          set -euo pipefail

          EXISTING=$(curl -sf \
            -H "Authorization: Bearer ${AK_TOKEN}" \
            "${AK_URL}/api/v3/core/applications/?slug=argocd" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['results'][0]['slug'] if r['count'] > 0 else '')")

          if [ -n "${EXISTING}" ]; then
            echo "Application already exists: ${EXISTING}"
          else
            curl -sf -X POST \
              -H "Authorization: Bearer ${AK_TOKEN}" \
              -H "Content-Type: application/json" \
              "${AK_URL}/api/v3/core/applications/" \
              -d "{
                \"name\": \"ArgoCD\",
                \"slug\": \"argocd\",
                \"provider\": ${PROVIDER_PK},
                \"meta_launch_url\": \"https://${AK_HOST}\",
                \"open_in_new_tab\": true
              }" \
              | python3 -c "import sys,json; print('Created:', json.load(sys.stdin)['name'])"
          fi

      - name: Patch ArgoCD ConfigMap
        run: |
          set -euo pipefail

          # Build the patch as JSON via python3 — avoids YAML-inside-shell quoting issues
          CM_PATCH=$(python3 -c "
import json
patch = {
    'data': {
        'url': 'https://${AK_HOST}',
        'oidc.config': '\n'.join([
            'name: Authentik',
            'issuer: https://${AK_HOST}/application/o/argocd/',
            'clientID: ${CLIENT_ID}',
            'clientSecret: ${CLIENT_SECRET}',
            'scopes:',
            '  - openid',
            '  - profile',
            '  - email',
        ])
    }
}
print(json.dumps(patch))
")

          kubectl patch configmap "${CF_RELEASE}-argo-cd-argocd-cm" \
            -n "${CF_NAMESPACE}" \
            --patch "${CM_PATCH}"

          echo "ArgoCD ConfigMap patched."

      - name: Restart ArgoCD server
        run: |
          set -euo pipefail
          eval "${RESTART_ARGOCD}"
          eval "${ROLLOUT_STATUS_ARGOCD}"

      - name: Done
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  ArgoCD SSO configured                                           ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  OIDC issuer:  https://${AK_HOST}/application/o/argocd/"
          echo "  Client ID:    ${CLIENT_ID}"
          echo ""
          echo "  Test in a private window: https://${AK_HOST}/argocd"
          echo "  → click 'Log in via Authentik'"
          echo "  → login as akadmin"
          echo "  → redirected back to ArgoCD, logged in"
          echo ""
          echo "  To grant akadmin ArgoCD admin role:"
          echo "  kubectl patch configmap ${CF_RELEASE}-argo-cd-argocd-rbac-cm \\"
          echo "    -n ${CF_NAMESPACE} \\"
          echo "    --patch '{\"data\":{\"policy.csv\":\"g, akadmin, role:admin\"}}'"
