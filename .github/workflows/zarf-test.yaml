name: Zarf Package Tests

on:
  pull_request:
    paths:
      - 'zarf.yaml'
      - 'platform.yaml'
      - 'manifests/**'
      - 'values/gitea.yaml'
      - 'values/jenkins.yaml'
      - 'engine/**'
      - '.github/workflows/zarf-test.yaml'
  push:
    branches: [main]
    paths:
      - 'zarf.yaml'
      - 'platform.yaml'
      - 'manifests/**'
      - 'values/gitea.yaml'
      - 'values/jenkins.yaml'
      - 'engine/**'
      - '.github/workflows/zarf-test.yaml'

# scorecard: restrict default token permissions to minimum required
permissions:
  contents: read

jobs:
  validate-package:
    name: Validate Zarf package structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml jsonschema

      - name: Check if Zarf files exist
        id: check_files
        run: |
          if [ -f "zarf.yaml" ] && [ -f "validate-package.py" ]; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ Zarf files not found - skipping validation (expected on non-v0.3 branches)"
          fi

      - name: Validate package structure
        if: steps.check_files.outputs.files_exist == 'true'
        run: python validate-package.py

      - name: Validate zarf.yaml syntax
        if: steps.check_files.outputs.files_exist == 'true'
        run: |
          python -c "
          import yaml
          with open('zarf.yaml') as f:
              zarf = yaml.safe_load(f)
          assert 'kind' in zarf, 'Missing kind field'
          assert zarf['kind'] == 'ZarfPackageConfig', 'Invalid kind'
          assert 'metadata' in zarf, 'Missing metadata'
          assert 'components' in zarf, 'Missing components'
          print(f'✓ Valid Zarf package with {len(zarf[\"components\"])} components')
          "

      - name: Validate platform.yaml syntax
        if: steps.check_files.outputs.files_exist == 'true'
        run: |
          python -c "
          import yaml
          with open('platform.yaml') as f:
              platform = yaml.safe_load(f)
          assert 'spec' in platform and 'components' in platform['spec'], 'Missing spec.components'
          print(f'✓ Valid platform spec with {len(platform[\"spec\"][\"components\"])} components')
          "

      - name: Check for required manifests
        if: steps.check_files.outputs.files_exist == 'true'
        run: |
          for manifest in wire-job.yaml wire-rbac.yaml platform-configmap.yaml gitea-admin-secret.yaml networkpolicy.yaml; do
            if [ ! -f "manifests/$manifest" ]; then
              echo "✗ Missing manifest: $manifest"
              exit 1
            fi
            echo "✓ Found manifest: $manifest"
          done

      - name: Validate Kubernetes manifests
        if: steps.check_files.outputs.files_exist == 'true'
        run: |
          for manifest in manifests/*.yaml; do
            echo "Validating $manifest..."
            python -c "
          import yaml, sys
          try:
              with open('$manifest') as f:
                  for doc in yaml.safe_load_all(f):
                      if doc is None:
                          continue
                      assert 'apiVersion' in doc, 'Missing apiVersion'
                      assert 'kind' in doc, 'Missing kind'
                      print(f'  ✓ {doc[\"kind\"]} valid')
          except Exception as e:
              print(f'  ✗ Error: {e}')
              sys.exit(1)
          "
          done

  lint-wire-engine:
    name: Lint wire engine code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check if engine directory exists
        id: check_engine
        run: |
          if [ -d "engine" ]; then
            echo "engine_exists=true" >> $GITHUB_OUTPUT
          else
            echo "engine_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Engine directory not found - skipping lint (expected on non-v0.3 branches)"
          fi

      - name: Set up Python
        if: steps.check_engine.outputs.engine_exists == 'true'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check_engine.outputs.engine_exists == 'true'
        working-directory: engine
        run: |
          pip install -e .
          pip install pylint

      - name: Run pylint
        if: steps.check_engine.outputs.engine_exists == 'true'
        working-directory: engine
        run: |
          pylint src/clusterfactory_engine/ --disable=missing-docstring,too-few-public-methods || true

      - name: Check imports
        if: steps.check_engine.outputs.engine_exists == 'true'
        working-directory: engine
        run: |
          python -c "
          from clusterfactory_engine import Credential, Component
          from clusterfactory_engine.components import Gitea, Jenkins
          print('✓ All imports successful')
          "

  build-wire-image:
    name: Build wire engine Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check if engine directory exists
        id: check_engine
        run: |
          if [ -d "engine" ]; then
            echo "engine_exists=true" >> $GITHUB_OUTPUT
          else
            echo "engine_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Engine directory not found - skipping build (expected on non-v0.3 branches)"
          fi

      - name: Set up Docker Buildx
        if: steps.check_engine.outputs.engine_exists == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build wire engine image
        if: steps.check_engine.outputs.engine_exists == 'true'
        working-directory: engine
        run: |
          docker build -t clusterfactory/wire:test -f Dockerfile .
          echo "✓ Wire engine image built successfully"

      - name: Inspect image
        if: steps.check_engine.outputs.engine_exists == 'true'
        run: |
          docker inspect clusterfactory/wire:test
          docker history clusterfactory/wire:test

      - name: Test image runs
        if: steps.check_engine.outputs.engine_exists == 'true'
        run: |
          docker run --rm --entrypoint python clusterfactory/wire:test -c "from clusterfactory_engine import Credential; print('✓ Engine loads correctly')"

  security-scan:
    name: Security scan wire engine
    runs-on: ubuntu-latest
    needs: build-wire-image
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check if engine directory exists
        id: check_engine
        run: |
          if [ -d "engine" ]; then
            echo "engine_exists=true" >> $GITHUB_OUTPUT
          else
            echo "engine_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Engine directory not found - skipping security scan (expected on non-v0.3 branches)"
          fi

      - name: Set up Docker Buildx
        if: steps.check_engine.outputs.engine_exists == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build image for scanning
        if: steps.check_engine.outputs.engine_exists == 'true'
        working-directory: engine
        run: docker build -t clusterfactory/wire:scan -f Dockerfile .

      - name: Run Trivy scan
        if: steps.check_engine.outputs.engine_exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'clusterfactory/wire:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        if: steps.check_engine.outputs.engine_exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  zarf-package-create:
    name: Create Zarf package (full integration test)
    runs-on: ubuntu-latest
    needs: [validate-package, lint-wire-engine, build-wire-image]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Check if zarf.yaml exists
        id: check_zarf
        run: |
          if [ -f "zarf.yaml" ]; then
            echo "zarf_exists=true" >> $GITHUB_OUTPUT
          else
            echo "zarf_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ zarf.yaml not found - skipping package creation (expected on non-v0.3 branches)"
          fi

      - name: Install Zarf CLI
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          curl -sL https://github.com/defenseunicorns/zarf/releases/download/v0.42.1/zarf_v0.42.1_Linux_amd64 -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version

      - name: Set up Helm
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Build Helm dependencies
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .
          echo "✓ Helm dependencies built"

      - name: Create Zarf package
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          zarf package create . --confirm --skip-sbom
          echo "✓ Zarf package created"

      - name: List package contents
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          PACKAGE=$(ls zarf-package-*.tar.zst | head -1)
          if [ -z "$PACKAGE" ]; then
            echo "✗ No Zarf package found!"
            exit 1
          fi
          echo "📦 Package: $PACKAGE"
          ls -lh "$PACKAGE"
          
          echo ""
          echo "📋 Package contents:"
          zarf package inspect "$PACKAGE"

      - name: Validate package can be deployed (dry-run)
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          PACKAGE=$(ls zarf-package-*.tar.zst | head -1)
          echo "Testing package deployment (dry-run)..."
          # Note: Full deployment requires k8s cluster - this validates package integrity
          zarf package inspect "$PACKAGE" --sbom-out /tmp/sbom || true
          echo "✓ Package structure validated"

      - name: Check package size
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        run: |
          PACKAGE=$(ls zarf-package-*.tar.zst | head -1)
          SIZE=$(stat -c%s "$PACKAGE" 2>/dev/null || stat -f%z "$PACKAGE")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "📊 Package size: ${SIZE_MB} MB"
          
          if [ $SIZE_MB -gt 1000 ]; then
            echo "⚠️ Warning: Package is quite large (${SIZE_MB} MB)"
          else
            echo "✓ Package size acceptable"
          fi

      - name: Upload package artifact
        if: steps.check_zarf.outputs.zarf_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: zarf-package
          path: zarf-package-*.tar.zst
          retention-days: 5
