name: Infra – Create Node

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "Name tag for the new instance"
        required: false
        default: "clusterfactory-node"
      instance_type:
        description: "EC2 instance type"
        required: false
        default: "t3.xlarge"
      volume_size:
        description: "Root volume size (GB)"
        required: false
        default: "80"

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION || 'eu-west-1' }}

    steps:
      - name: Launch EC2 instance
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id        ami-096f46d460613bed4 \
            --instance-type   "${{ github.event.inputs.instance_type }}" \
            --subnet-id       subnet-0f46f66deec1b3d02 \
            --security-group-ids sg-08529eed80e0f0420 \
            --iam-instance-profile Name=clusterfactory-node \
            --block-device-mappings "[{
              \"DeviceName\": \"/dev/xvda\",
              \"Ebs\": {
                \"VolumeSize\": ${{ github.event.inputs.volume_size }},
                \"VolumeType\": \"gp3\",
                \"DeleteOnTermination\": true
              }
            }]" \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=${{ github.event.inputs.instance_name }}},{Key=Env,Value=dev},{Key=ManagedBy,Value=gitea-workflow}]" \
              "ResourceType=volume,Tags=[{Key=Name,Value=${{ github.event.inputs.instance_name }}}]" \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "Launched: ${INSTANCE_ID}"
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "$GITHUB_ENV"

      - name: Wait for instance to be running
        run: |
          set -euo pipefail
          echo "Waiting for ${INSTANCE_ID} to enter running state..."
          aws ec2 wait instance-running --instance-ids "${INSTANCE_ID}"
          echo "Instance is running."

      - name: Print instance info
        run: |
          set -euo pipefail

          INFO=$(aws ec2 describe-instances \
            --instance-ids "${INSTANCE_ID}" \
            --query "Reservations[0].Instances[0].{ID:InstanceId,Type:InstanceType,State:State.Name,PublicIP:PublicIpAddress,PrivateIP:PrivateIpAddress,AZ:Placement.AvailabilityZone}" \
            --output json)

          echo "${INFO}" | python3 -m json.tool

          PUBLIC_IP=$(echo "${INFO}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('PublicIP') or 'none (private only)')")
          PRIVATE_IP=$(echo "${INFO}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('PrivateIP',''))")

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║  Node ready                                                      ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  Instance ID:  ${INSTANCE_ID}"
          echo "  Type:         ${{ github.event.inputs.instance_type }}"
          echo "  Private IP:   ${PRIVATE_IP}"
          echo "  Public IP:    ${PUBLIC_IP}"
          echo "  Disk:         ${{ github.event.inputs.volume_size }} GB gp3"
          echo ""
          echo "  Suitable for: RKE2 single-node + Authentik + ArgoCD + Gitea"
          echo ""
          echo "  Next: SSH in and bootstrap RKE2, then run install-platform workflow."
