name: RKE2 gate

# Tier-2 platform gate (ADR 0014): the forge on a real RKE2 host - Rocky 9,
# SELinux enforcing - on the self-hosted runner `cf-runner-1` (GCP, no
# inbound access, NAT egress only). Installs RKE2 from scratch, adds the
# StorageClass, runs zarf init, deploys a package, runs the full gate, and
# uninstalls RKE2 at the end so the VM is clean for the next run.
#
# Never runs for pull requests: this is a public repo and the runner must not
# execute untrusted code. Manual runs and the nightly schedule only.
on:
  workflow_dispatch:
    inputs:
      package_source:
        description: "release tag (e.g. v0.4.0-rc.1) or 'artifact' for the latest successful CI build on main"
        default: v0.4.0-rc.1
      keep_cluster:
        description: leave RKE2 and the forge running after the gate (for manual inspection; next run cleans up)
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'   # nightly 02:17 UTC

permissions:
  contents: read
  actions: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1
  # renovate: datasource=github-releases depName=rancher/local-path-provisioner
  LOCAL_PATH_VERSION: v0.0.37

jobs:
  rke2:
    name: forge on RKE2 (Rocky 9, SELinux)
    runs-on: [self-hosted, rke2, rocky9]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: ./.github/actions/rke2-up
        with:
          rke2-version: ${{ env.RKE2_VERSION }}
          zarf-version: ${{ env.ZARF_VERSION }}
          local-path-version: ${{ env.LOCAL_PATH_VERSION }}

      - name: Fetch the package (${{ inputs.package_source || 'v0.4.0-rc.1' }})
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ inputs.package_source || 'v0.4.0-rc.1' }}
        run: |
          mkdir -p pkg && cd pkg
          if [ "$SRC" = "artifact" ]; then
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n zarf-package-upstream
            cp "$GITHUB_WORKSPACE/cosign.pub" .
          else
            R="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SRC}"; V="${SRC#v}"
            curl -sSfLO "$R/zarf-package-clusterfactory-amd64-${V%%-rc.*}-upstream.tar.zst"
            curl -sSfLO "$R/cosign.pub"; curl -sSfLO "$R/clusterfactory-${V}-SHA256SUMS"
            sha256sum -c "clusterfactory-${V}-SHA256SUMS" --ignore-missing
          fi
          ls -lh

      - name: Deploy (signature verified)
        run: |
          zarf package deploy pkg/zarf-package-clusterfactory-*.tar.zst --key pkg/cosign.pub --confirm --no-color --timeout 12m \
            --set NEXUS_ACCEPT_CE_EULA=true

      - name: Full gate
        run: tests/deploy-check.sh clusterfactory

      - name: Redeploy must be idempotent
        run: |
          zarf package deploy pkg/zarf-package-clusterfactory-*.tar.zst --key pkg/cosign.pub --confirm --no-color --timeout 12m \
            --set NEXUS_ACCEPT_CE_EULA=true
          EXPECT_IDEMPOTENT=1 tests/deploy-check.sh clusterfactory

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -40 || true
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=100 || true
          sudo journalctl -u rke2-server --no-pager -n 40 || true

      - uses: ./.github/actions/rke2-down
        if: always() && inputs.keep_cluster != true
