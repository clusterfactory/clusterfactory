name: RKE2 gate

# Nightly / manual: a release (or the latest CI artifact) on the air-gapped
# RKE2 host cf-runner-1 - Rocky 9, SELinux enforcing, no internet route.
# Artifacts go through the private GCS bucket; control goes through the IAP
# tunnel from this hosted job. Uninstalls RKE2 at the end unless keep_cluster.
on:
  workflow_dispatch:
    inputs:
      package_source:
        description: "release tag (e.g. v0.4.0-rc.1) or 'artifact' for the latest successful CI build on main"
        default: v0.4.0-rc.1
      keep_cluster:
        description: leave RKE2 and the forge running after the gate (for manual inspection; next run cleans up)
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'   # nightly 02:17 UTC

permissions:
  contents: read
  actions: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1

jobs:
  rke2:
    name: release on the air-gapped RKE2 host
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ZONE: europe-west1-b
      VM: cf-runner-1
      BUCKET: gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}
      SRC: ${{ inputs.package_source || 'v0.4.0-rc.1' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Fetch the package (${{ inputs.package_source || 'v0.4.0-rc.1' }}) and stage it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg && cd pkg
          if [ "$SRC" = "artifact" ]; then
            RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n zarf-package-upstream && cp "$GITHUB_WORKSPACE/cosign.pub" .
          else
            R="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SRC}"; V="${SRC#v}"
            curl -sSfLO "$R/zarf-package-clusterfactory-amd64-${V%%-rc.*}-upstream.tar.zst"
            curl -sSfLO "$R/cosign.pub"; curl -sSfLO "$R/clusterfactory-${V}-SHA256SUMS"
            sha256sum -c "clusterfactory-${V}-SHA256SUMS" --ignore-missing
          fi
          cd ..
          D="$BUCKET/runs/${GITHUB_RUN_ID}"
          gcloud storage cp pkg/zarf-package-clusterfactory-*.tar.zst pkg/cosign.pub "$D/new/"
          gcloud storage cp hack/airgap-install.sh tests/deploy-check.sh "$D/bin/"
          gcloud storage cp jenkins/plugins.txt "$D/bin/plugins.txt"

      - name: On the VM - RKE2 up (air-gapped), zarf init, deploy, gate, idempotent redeploy
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<EOS
          set -euo pipefail
          A=/root/artifacts; rm -rf \$A; mkdir -p \$A/run
          gcloud storage cp -r "$BUCKET/platform/${{ env.RKE2_VERSION }}/*" \$A/ >/dev/null 2>&1
          gcloud storage cp -r "$BUCKET/runs/${GITHUB_RUN_ID}/*" \$A/run/ >/dev/null 2>&1
          chmod +x \$A/run/bin/*.sh
          ARTIFACT_DIR=\$A \$A/run/bin/airgap-install.sh up
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=\$PATH:/var/lib/rancher/rke2/bin:/usr/local/bin
          cd \$A/run; mkdir -p ../gate/jenkins && cp bin/plugins.txt ../gate/jenkins/ && cp bin/*.sh ../gate/
          dep() {
            zarf package deploy new/zarf-package-clusterfactory-*.tar.zst --key new/cosign.pub --confirm --no-color \
              --timeout 15m --set NEXUS_ACCEPT_CE_EULA=true 2>&1 | grep -E "ERR|Verified|wire engine"
          }
          dep; ../gate/deploy-check.sh clusterfactory
          dep; EXPECT_IDEMPOTENT=1 ../gate/deploy-check.sh clusterfactory
          EOS

      - name: Diagnostics on failure
        if: failure()
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<'EOS' || true
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=$PATH:/var/lib/rancher/rke2/bin
          kubectl get pods -A -o wide; kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -40
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=80; journalctl -u rke2-server --no-pager -n 40
          EOS

      - name: On the VM - uninstall unless keep_cluster; drop the bucket prefix
        if: always() && inputs.keep_cluster != true
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo bash /root/artifacts/run/bin/airgap-install.sh down; sudo rm -rf /root/artifacts /root/gate" || true
          gcloud storage rm -r "$BUCKET/runs/${GITHUB_RUN_ID}" || true
