name: RKE2 gate

# Nightly / manual: the customer path, verbatim - the all-in-one init package
# of a release (or of the last green run on main) on the air-gapped bare host
# cf-runner-1 (Rocky 9, SELinux enforcing, no internet route):
#   zarf init --confirm --key cosign.pub --set NEXUS_ACCEPT_CE_EULA=true
# then the gate, then the forge-only package of the same build over it (the
# documented upgrade path; must be idempotent) and the gate again.
# Packages go through the private GCS bucket; control goes through the IAP
# tunnel from this hosted job. Uninstalls RKE2 at the end unless keep_cluster.
on:
  workflow_dispatch:
    inputs:
      package_source:
        description: "release tag (e.g. v0.4.0) or 'main' for the packages of the last green run on main"
        default: main
      keep_cluster:
        description: leave RKE2 and the forge running after the gate (for manual inspection; next run cleans up)
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * *'   # nightly 02:17 UTC

permissions:
  contents: read
  actions: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0
  # renovate: datasource=github-releases depName=rancher/rke2
  RKE2_VERSION: v1.36.4+rke2r1

jobs:
  rke2:
    name: release on the air-gapped RKE2 host
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    concurrency:
      group: cf-runner-1
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ZONE: europe-west1-b
      VM: cf-runner-1
      BUCKET: gs://cf-artifacts-${{ secrets.GCP_PROJECT_ID }}
      SRC: ${{ inputs.package_source || 'main' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Stage the packages (${{ inputs.package_source || 'main' }}) and the gate scripts
        run: |
          D="$BUCKET/runs/${GITHUB_RUN_ID}"
          if [ "$SRC" = "main" ]; then
            gcloud storage cp "$BUCKET/forge/main/*" "$D/new/"
          else
            mkdir -p pkg && cd pkg
            R="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SRC}"; V="${SRC#v}"
            curl -sSfLO "$R/zarf-init-amd64-${ZARF_VERSION}.tar.zst"
            curl -sSfLO "$R/zarf-package-clusterfactory-amd64-${V%%-rc.*}-upstream.tar.zst"
            curl -sSfLO "$R/cosign.pub"; curl -sSfLO "$R/clusterfactory-${V}-SHA256SUMS"
            sha256sum -c "clusterfactory-${V}-SHA256SUMS" --ignore-missing
            cd .. && gcloud storage cp pkg/zarf-init-amd64-*.tar.zst pkg/zarf-package-clusterfactory-*.tar.zst pkg/cosign.pub "$D/new/"
          fi
          mkdir -p run/bin && cp hack/airgap-install.sh tests/deploy-check.sh run/bin/ && cp jenkins/plugins.txt run/bin/plugins.txt
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "rm -rf /tmp/cf-run"
          gcloud compute scp --recurse run "$VM:/tmp/cf-run" --zone "$ZONE" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo bash -s" <<'EOS'
          rm -rf /root/artifacts/run && mkdir -p /root/artifacts
          mv /tmp/cf-run /root/artifacts/run && chmod +x /root/artifacts/run/bin/*
          EOS

      - name: On the VM - zarf init (RKE2 + Zarf + forge), gate, forge-only package over it, gate
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<EOS
          set -euo pipefail; export PATH=\$PATH:/usr/local/bin:/var/lib/rancher/rke2/bin  # sudo secure_path lacks both
          A=/root/artifacts/run; mkdir -p \$A/new
          gcloud storage cp "$BUCKET/runs/${GITHUB_RUN_ID}/new/*" \$A/new/ >/dev/null 2>&1
          \$A/bin/airgap-install.sh down
          cd \$A; mkdir -p ../gate/jenkins && cp bin/plugins.txt ../gate/jenkins/ && cp bin/*.sh ../gate/
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          (cd new && timeout 2400 zarf init --confirm --no-color --key cosign.pub --set NEXUS_ACCEPT_CE_EULA=true 2>&1 \
            | grep -E "ERR|Verified|preflight ok|rke2 ready|init complete|wire engine")
          ../gate/deploy-check.sh clusterfactory
          zarf package deploy new/zarf-package-clusterfactory-*.tar.zst --confirm --no-color --timeout 15m \
            --key new/cosign.pub --set NEXUS_ACCEPT_CE_EULA=true 2>&1 | grep -E "ERR|Verified|wire engine"
          EXPECT_IDEMPOTENT=1 ../gate/deploy-check.sh clusterfactory
          EOS

      - name: Diagnostics on failure
        if: failure()
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo -E bash -s" <<'EOS' || true
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml PATH=$PATH:/var/lib/rancher/rke2/bin
          kubectl get pods -A -o wide; kubectl get events -n clusterfactory --sort-by=.lastTimestamp | tail -40
          kubectl logs -n clusterfactory -l app.kubernetes.io/name=cf-wire-engine --tail=80; journalctl -u rke2-server --no-pager -n 40
          EOS

      - name: On the VM - uninstall unless keep_cluster; drop the bucket prefix
        if: always() && inputs.keep_cluster != true
        run: |
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
            --command "sudo bash /root/artifacts/run/bin/airgap-install.sh down; sudo rm -rf /root/artifacts/run /root/gate" || true
          gcloud storage rm -r "$BUCKET/runs/${GITHUB_RUN_ID}" || true
