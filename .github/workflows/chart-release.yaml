name: Chart Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to commit updated docs/ back to main

jobs:
  chart-release:
    name: Package and publish Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Install Helm
        run: |
          source ./VERSIONS.env
          curl -sf https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
            | DESIRED_VERSION="${HELM_VERSION}" VERIFY_CHECKSUM=false bash
          helm version --short

      - name: Package chart
        run: |
          mkdir -p dist
          helm package platform/ -d dist/
          ls -lh dist/

      - name: Update Helm repo index
        run: |
          cp dist/*.tgz docs/
          helm repo index docs/ \
            --url https://clusterfactory.github.io/clusterfactory \
            --merge docs/index.yaml
          echo "Updated docs/index.yaml:"
          head -5 docs/index.yaml

      - name: Publish updated chart repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "No chart changes to publish." && exit 0
          git commit -m "chore: release $(ls dist/*.tgz | xargs basename)"
          git push
