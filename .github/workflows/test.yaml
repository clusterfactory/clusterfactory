name: Chart Tests

on:
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'Chart.lock'
      - 'values.yaml'
      - 'templates/**'
      - 'files/**'
      - 'charts/**'
      - 'hack/bundle.sh'
      - '.github/workflows/test.yaml'
  pull_request:
    paths:
      - 'Chart.yaml'
      - 'Chart.lock'
      - 'values.yaml'
      - 'templates/**'
      - 'files/**'
      - 'charts/**'
      - 'hack/bundle.sh'
      - '.github/workflows/test.yaml'

# scorecard: restrict default token permissions to minimum required
permissions:
  contents: read

jobs:
  lint-and-template:
    name: Lint and dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Helm lint
        run: helm lint . --strict

      - name: Helm template dry-run
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .
          helm template cf . --namespace cicd > /dev/null

  install-and-test:
    name: Install and test (k3d)
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Set up k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash

      - name: Create k3d cluster
        run: |
          k3d cluster create cf-test \
            --agents 1 \
            --k3s-arg "--disable=traefik@server:0" \
            --wait
          kubectl cluster-info

      - name: Build chart dependencies
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .

      - name: Install chart
        run: |
          helm upgrade --install cf . \
            --namespace cicd \
            --create-namespace \
            --rollback-on-failure \
            --timeout 15m \
            --set runner.enabled=false \
            --set gitea.resources.requests.memory=128Mi \
            --set gitea.resources.limits.memory=512Mi \
            --set jenkins.controller.resources.requests.memory=256Mi \
            --set jenkins.controller.resources.limits.memory=768Mi \
            --set jenkins.controller.javaOpts="-Xms128m -Xmx512m -XX:+UseContainerSupport"

      - name: Show pod status
        if: always()
        run: kubectl get pods -n cicd -o wide

      - name: Show wire job logs
        if: always()
        run: |
          kubectl logs -n cicd \
            -l app.kubernetes.io/name=wire \
            --tail=100 || true

      - name: Run helm tests
        run: helm test cf --namespace cicd --timeout 5m --filter name=cf-test-gitea --filter name=cf-test-jenkins

      - name: Show test output
        if: always()
        run: |
          kubectl logs -n cicd -l app.kubernetes.io/name=test-gitea --ignore-errors || true
          kubectl logs -n cicd -l app.kubernetes.io/name=test-jenkins --ignore-errors || true

      - name: Show test logs on failure
        if: failure()
        run: |
          kubectl get pods -n cicd
          kubectl logs -n cicd -l app.kubernetes.io/name=test-gitea || true
          kubectl logs -n cicd -l app.kubernetes.io/name=test-jenkins || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete cf-test

  airgap-bundle-test:
    name: Airgap bundle test
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Add helm repos and build dependencies
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .

      - name: Build bundle
        run: |
          chmod +x hack/bundle.sh
          ./hack/bundle.sh /tmp/cf-bundle

      - name: Validate bundle structure
        run: |
          BUNDLE_DIR=$(ls -d /tmp/cf-bundle/clusterfactory-airgap-*)
          echo "Bundle dir: $BUNDLE_DIR"

          for f in load.sh images.tar images.txt values-airgap.yaml; do
            [ -f "${BUNDLE_DIR}/${f}" ] \
              && echo "  ✓ ${f} present" \
              || { echo "  ✗ ${f} MISSING"; exit 1; }
          done

          ls "${BUNDLE_DIR}"/clusterfactory-*.tgz > /dev/null \
            && echo "  ✓ chart tgz present" \
            || { echo "  ✗ chart tgz MISSING"; exit 1; }

          count=$(wc -l < "${BUNDLE_DIR}/images.txt" | tr -d ' ')
          [ "$count" -gt 0 ] \
            && echo "  ✓ images.txt has ${count} entries" \
            || { echo "  ✗ images.txt is empty"; exit 1; }

          python3 -c "import yaml,sys; yaml.safe_load(open('${BUNDLE_DIR}/values-airgap.yaml'))" \
            && echo "  ✓ values-airgap.yaml is valid YAML" \
            || { echo "  ✗ values-airgap.yaml is invalid YAML"; exit 1; }

          [ -x "${BUNDLE_DIR}/load.sh" ] \
            && echo "  ✓ load.sh is executable" \
            || { echo "  ✗ load.sh is not executable"; exit 1; }

          echo "BUNDLE_DIR=${BUNDLE_DIR}" >> $GITHUB_ENV
          echo "Bundle validation passed."

      - name: Validate image coverage
        run: |
          RENDERED=$(helm template cf . --namespace cicd 2>/dev/null \
            | python3 -c "
          import sys, yaml

          def extract_images(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k == 'image' and isinstance(v, str) and v.strip():
                          yield v.strip()
                      else:
                          yield from extract_images(v)
              elif isinstance(obj, list):
                  for item in obj:
                      yield from extract_images(item)

          images = sorted(set(
              img
              for doc in yaml.safe_load_all(sys.stdin)
              if doc
              for img in extract_images(doc)
          ))
          for img in images:
              print(img)
          ")

          BUNDLED=$(cat "${BUNDLE_DIR}/images.txt")
          MISSING=""
          while IFS= read -r img; do
            echo "$BUNDLED" | grep -qF "$img" || MISSING="${MISSING}\n  ✗ ${img}"
          done <<< "$RENDERED"

          if [ -n "$MISSING" ]; then
            echo "Images in helm template but missing from bundle:"
            printf "%b\n" "$MISSING"
            exit 1
          fi
          echo "  ✓ All rendered images present in bundle"

      - name: Set up k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash

      - name: Create k3d cluster
        run: |
          k3d cluster create cf-airgap-test \
            --agents 1 \
            --k3s-arg "--disable=traefik@server:0" \
            --wait

      - name: Load images into cluster
        run: |
          echo "Loading images.tar into Docker daemon..."
          docker load -i "${BUNDLE_DIR}/images.tar"
          echo "Importing images into k3d containerd..."
          # read from images.txt — not docker images — to avoid importing unrelated images
          xargs k3d image import -c cf-airgap-test < "${BUNDLE_DIR}/images.txt"
          echo "  ✓ Images imported"

      - name: Install from bundle
        run: |
          CHART_TGZ=$(ls "${BUNDLE_DIR}"/clusterfactory-*.tgz | head -1)
          echo "Installing from: ${CHART_TGZ}"
          helm upgrade --install cf "${CHART_TGZ}" \
            --namespace cicd \
            --create-namespace \
            --rollback-on-failure \
            --timeout 15m \
            --set runner.enabled=false \
            --set jenkins.controller.resources.requests.memory=256Mi \
            --set jenkins.controller.resources.limits.memory=768Mi \
            --set jenkins.controller.javaOpts="-Xms128m -Xmx512m -XX:+UseContainerSupport" \
            --set gitea.image.pullPolicy=Never \
            --set jenkins.controller.image.pullPolicy=Never

      - name: Show pod status
        if: always()
        run: kubectl get pods -n cicd -o wide

      - name: Show wire job logs
        if: always()
        run: kubectl logs -n cicd -l app.kubernetes.io/name=wire --tail=100 || true

      - name: Run helm tests
        run: |
          helm test cf --namespace cicd --timeout 5m \
            --filter name=cf-test-gitea \
            --filter name=cf-test-jenkins

      - name: Show test output
        if: always()
        run: |
          kubectl logs -n cicd -l app.kubernetes.io/name=test-gitea --ignore-errors || true
          kubectl logs -n cicd -l app.kubernetes.io/name=test-jenkins --ignore-errors || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete cf-airgap-test || true
