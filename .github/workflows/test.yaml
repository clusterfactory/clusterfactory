name: Chart Tests

on:
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
      - 'Chart.lock'
      - 'values.yaml'
      - 'templates/**'
      - 'files/**'
      - 'charts/**'
      - '.github/workflows/test.yaml'
  pull_request:
    paths:
      - 'Chart.yaml'
      - 'Chart.lock'
      - 'values.yaml'
      - 'templates/**'
      - 'files/**'
      - 'charts/**'
      - '.github/workflows/test.yaml'

# scorecard: restrict default token permissions to minimum required
permissions:
  contents: read

jobs:
  lint-and-template:
    name: Lint and dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Helm lint
        run: helm lint . --strict

      - name: Helm template dry-run
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .
          helm template cf . --namespace cicd \
            | kubectl apply --dry-run=client -f - \
            --validate=false

  install-and-test:
    name: Install and test (k3d)
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Set up k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=v5.7.4 bash

      - name: Create k3d cluster
        run: |
          k3d cluster create cf-test \
            --agents 1 \
            --k3s-arg "--disable=traefik@server:0" \
            --wait
          kubectl cluster-info

      - name: Build chart dependencies
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .

      - name: Install chart
        run: |
          helm upgrade --install cf . \
            --namespace cicd \
            --create-namespace \
            --atomic \
            --timeout 10m \
            --set gitea.resources.requests.memory=64Mi \
            --set gitea.resources.limits.memory=256Mi \
            --set jenkins.controller.resources.requests.memory=256Mi \
            --set jenkins.controller.resources.limits.memory=768Mi \
            --set jenkins.controller.javaOpts="-Xms128m -Xmx512m -XX:+UseContainerSupport"

      - name: Show pod status
        if: always()
        run: kubectl get pods -n cicd -o wide

      - name: Show wire job logs
        if: always()
        run: |
          kubectl logs -n cicd \
            -l app.kubernetes.io/name=wire \
            --tail=100 || true

      - name: Run helm tests
        run: helm test cf --namespace cicd --timeout 5m --logs

      - name: Show test logs on failure
        if: failure()
        run: |
          kubectl get pods -n cicd
          kubectl logs -n cicd -l app.kubernetes.io/name=test-gitea || true
          kubectl logs -n cicd -l app.kubernetes.io/name=test-jenkins || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete cf-test
