name: Release

on:
  push:
    tags:
      - 'v*'

# workflow-level: minimum possible
# job-level permissions are declared explicitly per job below
permissions:
  contents: read

jobs:
  release:
    name: Package, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub Release + upload assets
      id-token: write      # cosign OIDC keyless signing (Sigstore)
      pull-requests: write # open PR to update docs/index.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1

      - name: Set up GitHub CLI
        run: gh --version   # pre-installed on ubuntu-latest, just verify

      - name: Resolve chart version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"             # e.g. v0.1.9
          VERSION="${TAG#v}"                   # strip leading v → 0.1.9
          CHART_VERSION="$(grep '^version:' Chart.yaml | awk '{print $2}')"
          if [ "${VERSION}" != "${CHART_VERSION}" ]; then
            echo "ERROR: tag ${TAG} does not match Chart.yaml version ${CHART_VERSION}"
            echo "Update Chart.yaml version to ${VERSION} before tagging"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Add Helm repos and build dependencies
        run: |
          helm repo add gitea https://dl.gitea.com/charts/
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build .

      - name: Package chart
        run: |
          mkdir -p release-artifacts
          helm package . -d release-artifacts/

      - name: Sign chart with cosign (keyless, Sigstore)
        run: |
          cosign sign-blob \
            --yes \
            --bundle "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz.bundle" \
            "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz"

      - name: Generate SBOM
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a  # v0.9.0
        with:
          path: "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz"
          format: spdx-json
          artifact-name: "clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json"
          output-file: "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM to chart with cosign
        run: |
          cosign attest-blob \
            --yes \
            --predicate "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json" \
            --type spdxjson \
            --bundle "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json.bundle" \
            "release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2.6.1
        with:
          generate_release_notes: true
          files: |
            release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz
            release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.tgz.bundle
            release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json
            release-artifacts/clusterfactory-${{ steps.version.outputs.version }}.sbom.spdx.json.bundle

      - name: Update Helm repo index and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="release/helm-index-${VERSION}"

          # copy packaged chart into docs/
          cp "release-artifacts/clusterfactory-${VERSION}.tgz" docs/

          # regenerate index merging with existing
          helm repo index docs/ \
            --url https://clusterfactory.github.io/clusterfactory/ \
            --merge docs/index.yaml

          # configure git identity for the bot commit
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # clean up stale branch from a previous attempt if it exists
          git push origin --delete "${BRANCH}" || true

          # create a branch, commit, push, open PR
          git checkout -b "${BRANCH}"
          git add docs/index.yaml "docs/clusterfactory-${VERSION}.tgz"
          git commit -m "release: publish clusterfactory-${VERSION} to Helm repo"
          git push origin "${BRANCH}"

          printf 'Automated PR from release workflow for tag `%s`.\n\nMerging this PR updates the GitHub Pages Helm repository index so that:\n```\nhelm repo update\nhelm upgrade --install cf clusterfactory/clusterfactory\n```\ninstalls version %s.\n\nThe chart tgz and cosign signature bundle are attached to the [GitHub Release](https://github.com/clusterfactory/clusterfactory/releases/tag/%s).\n' \
            "${TAG}" "${VERSION}" "${TAG}" > /tmp/pr-body.md

          gh pr create \
            --title "release: publish clusterfactory-${VERSION} to Helm repo" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${BRANCH}"
