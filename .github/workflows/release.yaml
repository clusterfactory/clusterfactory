name: Release

# uds-way.md §13 step 12 / §8: on a version tag, build the signed packages on a
# connected runner and attach them, the public key, the SBOMs and checksums to
# a GitHub release: the all-in-one init package (bare host -> RKE2 + Zarf + the
# forge with one `zarf init`) and the forge-only package (your own cluster, and
# the upgrade path). Consumers verify with `--key cosign.pub`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=zarf-dev/zarf
  ZARF_VERSION: v0.75.0

jobs:
  release:
    name: Build, sign and publish the package
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0

      - name: Tag must match zarf.yaml version (a -rc.N suffix makes a pre-release)
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="${VERSION%%-rc.*}"
          PKG_VERSION=$(awk '/^  version:/ {print $2; exit}' zarf.yaml)
          if [ "$BASE" != "$PKG_VERSION" ]; then
            echo "tag $TAG does not match zarf.yaml metadata.version $PKG_VERSION"; exit 1
          fi
          PRERELEASE=false; [ "$BASE" != "$VERSION" ] && PRERELEASE=true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Install Zarf and skopeo
        run: |
          curl -sSfL "https://github.com/zarf-dev/zarf/releases/download/${ZARF_VERSION}/zarf_${ZARF_VERSION}_Linux_amd64" -o /usr/local/bin/zarf
          chmod +x /usr/local/bin/zarf
          zarf version
          sudo apt-get -qq update && sudo apt-get -qq install -y skopeo >/dev/null

      - name: Build and sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || { echo "COSIGN_PRIVATE_KEY secret missing - refusing to release unsigned"; exit 1; }
          (umask 077; printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key")
          mkdir -p dist
          make package OUT=dist ZARF_CREATE_ARGS=--no-color SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
          make init-package OUT=dist SIGNING_KEY="$RUNNER_TEMP/cosign.key" SIGNING_KEY_PASS="$COSIGN_PASSWORD"
          rm -f "$RUNNER_TEMP/cosign.key"

      - name: Verify the signatures with the published public key
        run: |
          for p in dist/zarf-package-clusterfactory-*.tar.zst dist/zarf-init-amd64-*.tar.zst; do
            zarf package inspect definition "$p" --key cosign.pub --no-color > /dev/null
          done

      - name: Extract SBOMs and checksums
        run: |
          zarf package inspect sbom dist/zarf-package-clusterfactory-*.tar.zst --output dist/sboms --no-color
          tar -C dist -czf "dist/clusterfactory-${{ steps.version.outputs.version }}-sboms.tar.gz" sboms
          rm -rf dist/sboms
          cp cosign.pub dist/
          (cd dist && sha256sum * > "clusterfactory-${{ steps.version.outputs.version }}-SHA256SUMS")
          ls -lh dist

      - name: Release notes
        run: |
          {
            echo "## clusterfactory ${{ steps.version.outputs.version }}"
            echo
            echo "Two signed Zarf packages (upstream flavor), one public key, SBOMs and checksums."
            echo
            echo "**Bare host** (Rocky/RHEL 9, x86_64, SELinux fine, no internet needed): copy"
            echo "\`zarf\` ${ZARF_VERSION}, \`zarf-init-amd64-${ZARF_VERSION}.tar.zst\` and \`cosign.pub\` to it and run, as root:"
            echo
            echo '```bash'
            echo "sha256sum -c clusterfactory-${{ steps.version.outputs.version }}-SHA256SUMS --ignore-missing"
            echo "zarf init --confirm --key cosign.pub --set NEXUS_ACCEPT_CE_EULA=true"
            echo '```'
            echo
            echo "That gives RKE2, the Zarf registry and the wired forge (Gitea, Jenkins, Nexus) in about 8 minutes."
            echo
            echo "**Your own cluster**, or **upgrading** an existing install:"
            echo
            echo '```bash'
            echo "zarf package deploy zarf-package-clusterfactory-amd64-*-upstream.tar.zst \\"
            echo "  --key cosign.pub --set NEXUS_ACCEPT_CE_EULA=true"
            echo '```'
            echo
            echo "Prerequisites and the preflight contract: \`PREREQUISITES.md\`. Images and charts are pinned in"
            echo "\`zarf.yaml\`; the platform in \`rke2/zarf.yaml\`; decisions in \`adr/\`."
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""; [ "${{ steps.version.outputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "${GITHUB_REF_NAME}" dist/* --title "clusterfactory ${{ steps.version.outputs.version }}" --notes-file notes.md --verify-tag $FLAGS
