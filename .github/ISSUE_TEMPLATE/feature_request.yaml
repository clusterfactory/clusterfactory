name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests that include a concrete use case and a proposed approach
        are much more likely to be considered. Vague requests will be closed.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation. What are you trying to do with clusterfactory
        that you currently cannot?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you're proposing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: |
        Did you find a workaround? Is there another way to solve this?
        Why is it not sufficient?
    validations:
      required: false

  - type: dropdown
    id: willing-to-pr
    attributes:
      label: Would you be willing to open a PR for this?
      options:
        - "Yes"
        - "No"
        - "Maybe, with guidance"
    validations:
      required: true
