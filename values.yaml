# ─────────────────────────────────────────────
# Tested compatibility matrix
# Each chart version is tested against one specific pair.
# Override image tags at your own risk — the wiring is not adaptive.
#
# Run: helm show values clusterfactory/clusterfactory | grep -A6 "^compatibility:"
# ─────────────────────────────────────────────
compatibility:
  chart: "0.2.0"
  gitea: "1.23.6"        # gitea subchart appVersion (gitea/gitea:11.0.1)
  jenkins: "2.541.3"     # jenkins subchart appVersion (jenkins/jenkins:5.9.9)
  actRunner: "0.3.1"     # gitea/act_runner image tag

# ─────────────────────────────────────────────
# Wire job settings
# ─────────────────────────────────────────────
wire:
  org: clusterfactory
  # Engine selection: "bash" (default, stable) or "python" (new, experimental)
  engine: bash
  
  # Image overrides per engine
  image:
    bash: alpine:3.19
    python: ghcr.io/kube-tarian/clusterfactory-wire:0.2.0
  
  repo:
    name: hello-world

# ─────────────────────────────────────────────
# Gitea Actions runner (Scheduler + Ephemeral Job Pods)
# Scheduler polls for jobs and spawns fresh pods per job
# Pre-pull DaemonSet keeps runner image cached on all nodes
# ─────────────────────────────────────────────
runner:
  enabled: true
  image: gitea/act_runner:0.3.1
  capacity: 10        # Max concurrent ephemeral job pods (not threads)
  jobTTL: 300         # Seconds before completed job pod is auto-deleted
  job:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 1Gi

# ─────────────────────────────────────────────
# Gitea subchart values
# ─────────────────────────────────────────────
gitea:
  replicaCount: 1
  image:
    # tag: ""  # override Gitea app version, e.g. "1.22.0". Default: chart appVersion.
    pullPolicy: IfNotPresent
  # Recreate prevents LevelDB lock contention during upgrades (SQLite/LevelDB don't support concurrent access)
  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: false

  ingress:
    enabled: false

  service:
    http:
      type: ClusterIP
    ssh:
      type: ClusterIP

  # Disable all external dependencies — run lean with sqlite/memory
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false
  redis-cluster:
    enabled: false
  redis:
    enabled: false
  memcached:
    enabled: false

  # Gitea chart's internal 'gitea:' section (nested one level in subchart context)
  gitea:
    admin:
      username: gitea-admin
      password: changeme123!
      email: admin@cluster.local
    config:
      database:
        DB_TYPE: sqlite3
        PATH: /data/gitea/gitea.db
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
      session:
        PROVIDER: memory
      actions:
        ENABLED: "true"

# ─────────────────────────────────────────────
# Jenkins subchart values
# ─────────────────────────────────────────────
jenkins:
  controller:
    # To pin a Jenkins version: --set jenkins.controller.image.tag=2.492-jdk21
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    javaOpts: "-Xms256m -Xmx768m -XX:+UseContainerSupport"
    installPlugins:
      - "kubernetes:4423.vb_59f230b_ce53"
      - "workflow-aggregator:608.v67378e9d3db_1"
      - "git:5.10.1"
      - "configuration-as-code:2061.vc08919f7fc37"
      - "plain-credentials:199.v9f8e1f741799"
    prometheus:
      enabled: false
    ingress:
      enabled: false
    serviceType: ClusterIP
    JCasC:
      defaultConfig: false

  agent:
    enabled: false

  persistence:
    enabled: false

# ─────────────────────────────────────────────
# Persistence (disabled by default)
# clusterfactory is a bootstrap tool — emptyDir is the right default.
# Enable only if you need state to survive pod restarts.
# ─────────────────────────────────────────────
persistence:
  enabled: false
  storageClassName: ""   # "" = cluster default, "-" = no dynamic provisioning
  size: 5Gi

# ─────────────────────────────────────────────
# NetworkPolicy
# Enable on clusters with a default-deny NetworkPolicy (Calico, Cilium, etc.).
# Without this, the wire job cannot reach Gitea and Jenkins and will fail
# silently on first install. Enabled by default — safe to disable if your
# cluster has no NetworkPolicy enforcement.
# ─────────────────────────────────────────────
networkPolicy:
  enabled: true
