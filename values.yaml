# clusterfactory values.yaml
#
# One knob: mode.
#   gitea-actions  → Gitea + Gitea Actions runner (no Jenkins)
#   jenkins        → Gitea (git host) + Jenkins (workflow engine)
#   both           → Gitea + Gitea Actions runner + Jenkins
#
# Everything else is derived from mode via templates/_mode-helpers.tpl.
# Subchart values below are passed through to the upstream gitea/jenkins
# charts and reflect a working demo configuration. Override as needed.

mode: both

# ── wiring config ─────────────────────────────────────────────────────────
# Inputs to the post-install wire Job. These are the only things the user
# typically customizes besides the admin password.
wire:
  org: cf-demo
  repo:
    name: hello-world
    description: "ClusterFactory bootstrap repository"
  # Jenkins job that gets created and webhook-wired to the bootstrap repo.
  jenkinsJob: hello-world

# ── gitea admin secret ────────────────────────────────────────────────────
# The parent chart owns the truth for the Gitea admin credential.
# Both Gitea (via existingSecret) and the wire Job consume it.
giteaAdmin:
  username: gitea-admin
  # Required: pass via --set giteaAdmin.password=... or values file.
  # No default — install fails fast if unset rather than shipping a known weak password.
  password: ""

# ── upstream subchart values ──────────────────────────────────────────────
# These are passed to the gitea (11.0.1) and jenkins (5.9.9) subcharts.
# enabled flags are set by mode-helpers.tpl via overrides at install time;
# the values here are the rest of the configuration.

gitea:
  enabled: true
  gitea:
    admin:
      existingSecret: clusterfactory-gitea-admin
    config:
      database:
        DB_TYPE: sqlite3
      session:
        PROVIDER: memory
      cache:
        ADAPTER: memory
      queue:
        TYPE: level
      server:
        PROTOCOL: http
        HTTP_PORT: 3000
  persistence:
    enabled: false   # demo: emptyDir. Override for real deployments.
  service:
    http:
      type: ClusterIP
      port: 3000
  ingress:
    enabled: false
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Disable bundled HA backends — demo runs SQLite with in-memory cache/session.
  redis-cluster:
    enabled: false
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false

jenkins:
  enabled: true
  controller:
    # Jenkins admin password is auto-generated by the subchart and stored in
    # secret <release>-jenkins / key jenkins-admin-password. The wire Job reads it.
    installPlugins:
      - kubernetes:4253.v7700d91739e5
      - workflow-aggregator:600.vb_57cdd26fdd7
      - git:5.5.2
      - configuration-as-code:2053.vb_0da_47381a_25
      - gitea:1.4.7
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 768Mi
    javaOpts: "-Xms128m -Xmx512m -XX:+UseContainerSupport"
  persistence:
    enabled: false   # demo: emptyDir
  agent:
    enabled: true

# ── gitea actions runner ──────────────────────────────────────────────────
# The Gitea chart's act_runner subchart could be used, but we ship a
# minimal DaemonSet runner that the wire Job registers post-install.
# This keeps the runner registration in our wiring discipline rather than
# splitting it across the upstream chart's lifecycle.
runner:
  # enabled is set by mode-helpers — true for gitea-actions/both, false for jenkins
  image: gitea/act_runner:0.2.11
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── wire job ──────────────────────────────────────────────────────────────
wireJob:
  image: alpine:3.21   # has apk, sh, base64. Will install curl and jq. ~8MB.
  # Used by Zarf for image discovery — same image is also referenced by runner above.

# ── network policy ────────────────────────────────────────────────────────
# Lock down inter-namespace traffic. Disable for dev clusters that share a namespace.
networkPolicy:
  enabled: false

# ── preflight ─────────────────────────────────────────────────────────────
preflight:
  enabled: true
  # Minimum Kubernetes version. Bumped only when we actually depend on newer APIs.
  minK8sVersion: "1.27"
