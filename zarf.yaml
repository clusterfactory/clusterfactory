kind: ZarfPackageConfig

metadata:
  name: clusterfactory
  description: "ClusterFactory — one helm install for working CI/CD, packaged for airgap."
  version: 0.4.0

components:
  - name: clusterfactory
    description: "Gitea + optional Jenkins + optional Gitea Actions, wired by post-install Job."
    required: true
    charts:
      - name: clusterfactory
        version: 0.4.0
        namespace: cicd
        localPath: .
        valuesFiles:
          - values-airgap.yaml
    images:
      # Wire Job and runner init container.
      - alpine/curl:8.10.0
      # Gitea Actions runner.
      - gitea/act_runner:0.2.11
      # Subchart images — pinned to the versions in values.yaml.
      # Bump in lockstep with subchart upgrades.
      - gitea/gitea:1.23.6-rootless
      - docker.io/jenkins/jenkins:2.541.3-jdk21
      - docker.io/kiwigrid/k8s-sidecar:2.5.0
      # Jenkins agents (used by the bootstrap Jenkinsfile).
      - alpine:3.20
      - node:20-bookworm
