# NetworkPolicies for cicd namespace
# Default-deny ingress except wire → {gitea, jenkins}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cf-gitea-ingress
  namespace: cicd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wire
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cf-jenkins-ingress
  namespace: cicd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wire
      ports:
        - port: 8080
          protocol: TCP
