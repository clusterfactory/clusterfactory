apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-wire
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cf-wire
  namespace: cicd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cf-wire-result"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]   # needed for initial creation; resourceNames doesn't cover create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cf-wire
  namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cf-wire
subjects:
  - kind: ServiceAccount
    name: cf-wire
    namespace: cicd
