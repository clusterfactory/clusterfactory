[project]
name = "clusterfactory-engine"
version = "0.3.0"
description = "Wire engine for cross-service credential injection"
authors = [{name = "clusterfactory contributors"}]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "kubernetes>=28.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pylint>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests are colocated with the package: engine/tests/{unit,integration}/
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end tests requiring a live cluster (run via test-e2e make target)",
]
