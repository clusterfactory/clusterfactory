[project]
name = "clusterfactory-engine"
version = "0.3.0"
description = "Wire engine for cross-service credential injection"
authors = [{name = "clusterfactory contributors"}]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "kubernetes>=28.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pylint>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
