apiVersion: v2
name: clusterfactory
description: One helm install for a working CI/CD platform — Gitea, optionally Jenkins, optionally Gitea Actions. Online or airgapped via Zarf.
type: application
version: 0.4.0
appVersion: "1.0.0"
keywords:
  - ci-cd
  - gitea
  - jenkins
  - airgap
home: https://github.com/clusterfactory/clusterfactory
sources:
  - https://github.com/clusterfactory/clusterfactory
maintainers:
  - name: clusterfactory
dependencies:
  - name: gitea
    version: "11.0.1"
    repository: "https://dl.gitea.com/charts/"
    condition: gitea.enabled
  - name: jenkins
    version: "5.9.9"
    repository: "https://charts.jenkins.io"
    condition: jenkins.enabled
