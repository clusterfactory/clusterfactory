{{- if .Values.networkPolicy.enabled }}
# ── Gitea: allow ingress on port 3000 ────────────────────────────────────────
# Permits the wire job, runner, and helm test pod to reach Gitea HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gitea-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wire
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea-runner
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: test-gitea
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 3000
          protocol: TCP
{{- if .Values.jenkins.enabled }}
---
# ── Jenkins: allow ingress on port 8080 ──────────────────────────────────────
# Permits the wire job and helm test pod to reach Jenkins HTTP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-jenkins-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: jenkins-controller
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wire
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: test-jenkins
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
{{- end }}
