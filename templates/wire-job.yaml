apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wire
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: wire
    wire.clusterfactory.io/engine: {{ .Values.wire.engine | quote }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wire
        app.kubernetes.io/instance: {{ .Release.Name }}
        wire.clusterfactory.io/engine: {{ .Values.wire.engine | quote }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Release.Name }}-wire
      containers:
        - name: wire
          {{- include "clusterfactory.wire.container" . | nindent 10 }}
          env:
            - name: GITEA_SVC
              value: "{{ .Release.Name }}-gitea-http.{{ .Release.Namespace }}.svc.cluster.local"
            - name: JENKINS_SVC
              value: "{{ .Release.Name }}-jenkins.{{ .Release.Namespace }}.svc.cluster.local"
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: clusterfactory-gitea-admin
                  key: username
            - name: GITEA_PASS
              valueFrom:
                secretKeyRef:
                  name: clusterfactory-gitea-admin
                  key: password
            - name: JENKINS_USER
              value: "admin"
            - name: JENKINS_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-jenkins
                  key: jenkins-admin-password
            - name: ORG
              value: {{ .Values.wire.org | quote }}
            - name: REPO
              value: {{ .Values.wire.repo.name | quote }}
{{- if eq .Values.wire.engine "bash" }}
            - name: JENKINSFILE_B64
              value: {{ .Files.Get "files/Jenkinsfile" | b64enc | quote }}
            - name: WORKFLOW_B64
              value: {{ .Files.Get "files/.gitea/workflows/ci.yaml" | b64enc | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RUNNER_SECRET_NAME
              value: "{{ .Release.Name }}-runner-reg-token"
{{- end }}
{{- if eq .Values.wire.engine "python" }}
      volumes:
        - name: platform-config
          configMap:
            name: {{ .Release.Name }}-platform
{{- end }}
