{{- include "clusterfactory.mode.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clusterfactory.giteaAdminSecret" . }}
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    # Created before subcharts so Gitea can read it via existingSecret.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  username: {{ .Values.giteaAdmin.username | quote }}
  password: {{ .Values.giteaAdmin.password | quote }}
