{{- if .Values.persistence.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-preflight
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preflight
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-preflight
      containers:
        - name: preflight
          image: {{ .Values.wire.image }}
          command: [sh, -c]
          args:
            - |
              set -eu
              apk add -q curl jq

              log()  { echo "[preflight] $*"; }
              die()  { echo "[preflight] ERROR: $*" >&2; exit 1; }

              WANT_CLASS="{{ .Values.persistence.storageClassName }}"
              K8S="https://kubernetes.default.svc"
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              log "Checking StorageClass availability..."

              sc_json=$(curl -fsSL \
                -H "Authorization: Bearer ${SA_TOKEN}" \
                --cacert "${CACERT}" \
                "${K8S}/apis/storage.k8s.io/v1/storageclasses")

              names=$(echo "$sc_json" | jq -r '.items[].metadata.name')
              defaults=$(echo "$sc_json" | jq -r '
                .items[]
                | select(
                    .metadata.annotations["storageclass.kubernetes.io/is-default-class"] == "true"
                  )
                | .metadata.name')

              if [ -z "$WANT_CLASS" ]; then
                # user wants cluster default
                if [ -z "$defaults" ]; then
                  echo ""
                  echo "  [preflight] ERROR: persistence.enabled=true but no default StorageClass found."
                  echo ""
                  echo "  Option 1 — disable persistence (recommended for bootstrap use):"
                  echo "    helm upgrade --install cf . --set persistence.enabled=false"
                  echo ""
                  echo "  Option 2 — set a StorageClass explicitly:"
                  echo "    --set persistence.storageClassName=local-path   # RKE2 / k3s"
                  echo "    --set persistence.storageClassName=standard     # kind / GKE"
                  echo "    --set persistence.storageClassName=gp3          # EKS"
                  echo "    --set persistence.storageClassName=longhorn     # Longhorn"
                  echo ""
                  if [ -n "$names" ]; then
                    echo "  StorageClasses available on this cluster (none is default):"
                    echo "$names" | while read -r n; do echo "    $n"; done
                  else
                    echo "  No StorageClasses found on this cluster."
                  fi
                  echo ""
                  die "no default StorageClass"
                fi
                log "Default StorageClass found: ${defaults} — OK"
              else
                # user specified a class — check it exists
                found=$(echo "$sc_json" | jq -r --arg want "$WANT_CLASS" '
                  .items[] | select(.metadata.name == $want) | .metadata.name')
                if [ -z "$found" ]; then
                  echo ""
                  echo "  [preflight] ERROR: StorageClass '${WANT_CLASS}' not found on this cluster."
                  echo ""
                  if [ -n "$names" ]; then
                    echo "  StorageClasses available:"
                    echo "$names" | while read -r n; do echo "    $n"; done
                  else
                    echo "  No StorageClasses found on this cluster."
                  fi
                  echo ""
                  die "StorageClass '${WANT_CLASS}' not found"
                fi
                log "StorageClass '${WANT_CLASS}' found — OK"
              fi

              log "Preflight passed."
{{- end }}
