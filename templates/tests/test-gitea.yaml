apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-test-gitea
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-gitea
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: {{ .Values.wire.image.bash }}
          command: [sh, -c]
          args:
            - |
              set -eu
              apk add -q curl jq

              pass() { echo "[test] PASS: $*"; }
              fail() { echo "[test] FAIL: $*" >&2; exit 1; }

              GITEA_URL="http://${GITEA_SVC}:3000"

              # Gitea API reachable
              ver=$(curl -fsSL "${GITEA_URL}/api/v1/version" | jq -r '.version')
              [ -n "$ver" ] && [ "$ver" != "null" ] \
                && pass "Gitea reachable (version: ${ver})" \
                || fail "Gitea API not reachable"

              # org exists
              code=$(curl -o /dev/null -sw "%{http_code}" \
                -u "${GITEA_USER}:${GITEA_PASS}" \
                "${GITEA_URL}/api/v1/orgs/${ORG}")
              [ "$code" = "200" ] \
                && pass "org '${ORG}' exists" \
                || fail "org '${ORG}' not found (HTTP ${code})"

              # repo exists
              code=$(curl -o /dev/null -sw "%{http_code}" \
                -u "${GITEA_USER}:${GITEA_PASS}" \
                "${GITEA_URL}/api/v1/repos/${ORG}/${REPO}")
              [ "$code" = "200" ] \
                && pass "repo '${ORG}/${REPO}' exists" \
                || fail "repo '${ORG}/${REPO}' not found (HTTP ${code})"

              # Jenkinsfile pushed
              code=$(curl -o /dev/null -sw "%{http_code}" \
                -u "${GITEA_USER}:${GITEA_PASS}" \
                "${GITEA_URL}/api/v1/repos/${ORG}/${REPO}/contents/Jenkinsfile")
              [ "$code" = "200" ] \
                && pass "Jenkinsfile present in repo" \
                || fail "Jenkinsfile not found in repo (HTTP ${code})"

              # Gitea Actions workflow pushed
              code=$(curl -o /dev/null -sw "%{http_code}" \
                -u "${GITEA_USER}:${GITEA_PASS}" \
                "${GITEA_URL}/api/v1/repos/${ORG}/${REPO}/contents/.gitea/workflows/ci.yaml")
              [ "$code" = "200" ] \
                && pass "Actions workflow present in repo" \
                || fail "Actions workflow not found in repo (HTTP ${code})"

              echo "[test] all Gitea checks passed"
          env:
            - name: GITEA_SVC
              value: "{{ .Release.Name }}-gitea-http.{{ .Release.Namespace }}.svc.cluster.local"
            - name: GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: clusterfactory-gitea-admin
                  key: username
            - name: GITEA_PASS
              valueFrom:
                secretKeyRef:
                  name: clusterfactory-gitea-admin
                  key: password
            - name: ORG
              value: {{ .Values.wire.org | quote }}
            - name: REPO
              value: {{ .Values.wire.repo.name | quote }}
