{{- if eq (include "clusterfactory.mode.runnerEnabled" .) "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}-test-actions"
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-test-actions"
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
    resourceNames:
      - "{{ .Release.Name }}-runner-reg-token"
      - "{{ .Release.Name }}-wire-result"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-test-actions"
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-test-actions"
roleRef:
  kind: Role
  name: "{{ .Release.Name }}-test-actions"
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-actions"
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
    app.kubernetes.io/name: test-actions
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: "{{ .Release.Name }}-test-actions"
  containers:
    - name: test
      image: {{ .Values.wireJob.image | quote }}
      env:
        - name: GITEA_URL
          value: "http://{{ include "clusterfactory.giteaService" . }}:3000"
        - name: GITEA_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "clusterfactory.giteaAdminSecret" . }}
              key: username
        - name: GITEA_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "clusterfactory.giteaAdminSecret" . }}
              key: password
      command: ["/bin/sh", "-eu", "-c"]
      args:
        - |
          set -eu
          echo "test-actions | verifying Actions wiring completed"
          # Check 1: runner registration token secret exists
          echo "test-actions | checking runner registration token secret via K8s API"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
          
          resp=$(curl -fsS --cacert "$CACERT" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/secrets/{{ .Release.Name }}-runner-reg-token" 2>/dev/null || echo '')
          
          if echo "$resp" | grep -q '"kind":"Secret"'; then
            echo "test-actions | ✓ runner registration token secret exists"
          else
            echo "test-actions | FAIL: runner registration token secret not found" >&2
            exit 1
          fi
          
          # Check 2: verify wiring receipt exists
          resp=$(curl -fsS --cacert "$CACERT" \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/configmaps/{{ .Release.Name }}-wire-result" 2>/dev/null || echo '')
          
          if echo "$resp" | grep -q 'gitea:runner:RunnerToken'; then
            echo "test-actions | ✓ wiring receipt confirms runner token issued"
          else
            echo "test-actions | WARN: wiring receipt doesn't show runner token"
          fi
          
          echo "test-actions | OK - Actions wiring verified"
          exit 0
{{- end }}
