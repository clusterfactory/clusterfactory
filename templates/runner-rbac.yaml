{{- if eq (include "clusterfactory.mode.runnerEnabled" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["{{ .Release.Name }}-runner-reg-token"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    {{- include "clusterfactory.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-runner
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-runner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
