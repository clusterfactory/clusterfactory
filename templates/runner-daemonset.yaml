{{- $runnerEnabled := and .Values.runner.enabled (or (eq .Values.mode "gitea-actions") (eq .Values.mode "both")) }}
{{- if $runnerEnabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-runner
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    clusterfactory.io/mode: {{ .Values.mode | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea-runner
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-runner

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: register
          image: {{ include "clusterfactory.image" (dict "Values" .Values "name" "actRunner") }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              echo "[runner-init] waiting for registration token..."

              until [ -s /runner-token/token ]; do
                sleep 5
              done

              rm -f /data/.runner

              echo "[runner-init] registering with Gitea at ${GITEA_INSTANCE_URL}..."

              act_runner register \
                --config /runner-config/config.yaml \
                --instance "${GITEA_INSTANCE_URL}" \
                --token "$(cat /runner-token/token)" \
                --name "k8s-runner-${NODE_NAME}" \
                --labels "ubuntu-latest:kubernetes" \
                --no-interactive

              echo "[runner-init] registration complete"

          env:
            - name: GITEA_INSTANCE_URL
              value: "http://{{ .Release.Name }}-gitea-http.{{ .Release.Namespace }}.svc.cluster.local:3000"

            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-token
              mountPath: /runner-token
            - name: runner-config
              mountPath: /runner-config

      containers:
        - name: runner
          image: {{ include "clusterfactory.image" (dict "Values" .Values "name" "actRunner") }}

          command:
            - act_runner
            - daemon
            - --config
            - /runner-config/config.yaml

          env:
            - name: HOME
              value: /data

            - name: GITEA_INSTANCE_URL
              value: "http://{{ .Release.Name }}-gitea-http.{{ .Release.Namespace }}.svc.cluster.local:3000"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: runner-config
              mountPath: /runner-config

      volumes:
        - name: runner-data
          emptyDir: {}

        - name: runner-token
          secret:
            secretName: {{ .Release.Name }}-runner-reg-token
            optional: true

        - name: runner-config
          configMap:
            name: {{ .Release.Name }}-runner-config
{{- end }}
