{{- $runnerEnabled := and .Values.runner.enabled (or (eq .Values.mode "gitea-actions") (eq .Values.mode "both")) }}
{{- if $runnerEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-runner-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    clusterfactory.io/mode: {{ .Values.mode | quote }}
data:
  config.yaml: |
    log:
      level: info

    runner:
      file: /data/.runner
      capacity: {{ .Values.runner.capacity | default 2 }}
      fetch_interval: 2s
      fetch_timeout: 5s
      labels:
        - "ubuntu-latest:kubernetes"

    cache:
      enabled: false

    container:
      network: ""

    host:
      workdir_parent: /tmp/act_runner_work
{{- end }}
